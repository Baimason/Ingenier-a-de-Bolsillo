  id:"algo",title:"Algoritmos Fundamentales",
  desc:"Recursión, grafos, BFS, DFS y backtracking desde cero",icon:"λ",
  lessons:[
  {id:"algo-01",title:"Recursión",sub:"La función que se llama a sí misma",min:13,
   sections:[
    {t:"text",v:"Recursión es cuando una función se llama a sí misma para resolver una versión más pequeña del mismo problema. Es una herramienta poderosa para problemas que tienen estructura repetitiva o jerárquica. Unity la usa internamente todo el tiempo: GetComponentsInChildren() recorre la jerarquía de manera recursiva."},
    {t:"h2",v:"La estructura de toda función recursiva"},
    {t:"text",v:"Toda función recursiva tiene exactamente dos partes: el caso base (que detiene la recursión) y el caso recursivo (que se llama a sí misma con un problema más pequeño). Sin caso base, la recursión no termina nunca y obtenés un Stack Overflow."},
    {t:"code",v:"// Caso simple: contar hacia atrás\nvoid Countdown(int n)\n{\n    if (n <= 0)          // CASO BASE: detiene la recursión\n    {\n        Debug.Log(\"Despegue!\");\n        return;\n    }\n    Debug.Log(n);        // Trabajo de este nivel\n    Countdown(n - 1);    // CASO RECURSIVO: problema más pequeño\n}\n// Countdown(3) imprime: 3, 2, 1, \"Despegue!\""},
    {t:"h2",v:"La pila de llamadas (Call Stack)"},
    {t:"text",v:"Cada llamada recursiva apila un nuevo frame en el call stack. Cuando llega al caso base, empieza a desapilarse. Con Countdown(3): el runtime llama Countdown(3), luego Countdown(2), luego Countdown(1), luego Countdown(0) que retorna, y después los anteriores retornan en orden inverso."},
    {t:"code",v:"// Recorrer la jerarquía de Unity de forma recursiva\n// (GetComponentsInChildren hace esto internamente)\nint CountAllObjects(Transform parent)\n{\n    int count = 1;  // Contarse a sí mismo\n\n    foreach (Transform child in parent)\n    {\n        count += CountAllObjects(child);  // Recursión por cada hijo\n    }\n\n    return count;\n}\n// Funciona sin importar qué tan anidada esté la jerarquía"},
    {t:"call",label:"Analogía",v:"Imaginá que tenés que contar todos los archivos de una carpeta que tiene subcarpetas, que a su vez tienen más subcarpetas. La solución recursiva dice: el total de esta carpeta = los archivos de esta carpeta + CountFiles() de cada subcarpeta. Cada subcarpeta aplica la misma lógica."},
    {t:"h2",v:"Stack Overflow: el error más común"},
    {t:"code",v:"// PELIGRO: sin caso base válido\nvoid InfiniteRecursion(int n)\n{\n    Debug.Log(n);\n    InfiniteRecursion(n + 1);  // Nunca para\n    // -> StackOverflowException cuando se agota el stack\n}\n\n// PELIGRO: caso base inalcanzable\nvoid BrokenCountdown(int n)\n{\n    if (n == 0) return;          // Solo para con n exactamente 0\n    BrokenCountdown(n - 2);      // Con n impar nunca llega a 0\n}"},
    {t:"h2",v:"Cuándo usar recursión"},
    {t:"text",v:"Recursión brilla en problemas con estructura jerárquica o que se dividen naturalmente en subproblemas iguales: árboles y jerarquías (la scene hierarchy de Unity), algoritmos divide y vencerás (merge sort, binary search recursivo), y exploración de grafos (BFS y DFS, que veremos en las próximas lecciones). Para loops simples, la iteración con for o foreach es más clara y eficiente."},
    {t:"call",label:"En una entrevista",v:"\"Recursión es cuando una función se llama a sí misma con un subproblema más pequeño. Requiere un caso base que detenga la recursión y un caso recursivo que reduzca el problema. Se usa cuando el problema tiene estructura jerárquica o se divide naturalmente en subproblemas del mismo tipo. El riesgo es el Stack Overflow si el caso base no es alcanzable.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué dos partes debe tener toda función recursiva bien formada?",opts:["Un loop for y un loop while","Un caso base que detiene la recursión y un caso recursivo que se llama a sí misma","Un return al principio y otro al final","Un try/catch y un finally"],correct:1,exp:"Toda recursión necesita un caso base (que detiene la recursión cuando el problema es lo suficientemente pequeño) y un caso recursivo (que se llama a sí misma con una versión reducida del problema). Sin caso base, la recursión es infinita."},
    {id:"e2",type:"tf",q:"Una función recursiva sin caso base válido eventualmente termina sola.",correct:false,exp:"Falso. Sin un caso base alcanzable, la función se llama a sí misma indefinidamente hasta agotar el call stack, lo que produce una StackOverflowException. El caso base es obligatorio para que la recursión termine."},
    {id:"e3",type:"mc",q:"¿Para qué tipo de problema es más natural usar recursión?",opts:["Sumar todos los números del 1 al 100","Recorrer una jerarquía de GameObjects de profundidad desconocida","Verificar si un número es par","Comparar dos strings"],correct:1,exp:"Una jerarquía de GameObjects con profundidad desconocida es el caso ideal para recursión: no sabés cuántos niveles hay, cada nodo tiene hijos con la misma estructura. Un loop for no funciona porque no conocés la profundidad. La recursión lo resuelve naturalmente."},
    {id:"e4",type:"self",q:"Describí en tus propias palabras por qué GetComponentsInChildren() de Unity es naturalmente recursivo.",model:"GetComponentsInChildren() necesita revisar no solo los hijos directos de un GameObject, sino también los hijos de los hijos, y los hijos de esos hijos, sin saber de antemano cuántos niveles hay. La solución recursiva dice: 'busca en este nodo, luego llama a la misma función en cada hijo'. Cada hijo aplica la misma lógica a su propia sub-jerarquía. Esto funciona para cualquier profundidad sin conocerla de antemano."}
   ]},
  {id:"algo-02",title:"Grafos — Conceptos",sub:"Nodos, conexiones y cómo representarlos",min:10,
   sections:[
    {t:"text",v:"Un grafo es una estructura de datos formada por nodos (también llamados vértices) conectados por aristas (edges). Es uno de los modelos más versátiles en informática: mapas de niveles, árboles de diálogo, sistemas de dependencias, redes de caminos y el NavMesh de Unity son todos grafos."},
    {t:"h2",v:"Tipos de grafos"},
    {t:"text",v:"Grafo no dirigido: las aristas no tienen dirección. Si hay conexión entre A y B, podés ir de A a B y de B a A. Grafo dirigido: las aristas tienen dirección. A puede conectar con B sin que B conecte con A (como en un árbol de diálogo donde ciertas opciones son de ida). Grafo ponderado: las aristas tienen un peso o costo (como la distancia entre dos puntos del mapa)."},
    {t:"code",v:"// El NavMesh de Unity es un grafo ponderado no dirigido:\n// cada polígono navegable es un nodo, las conexiones entre\n// polígonos adyacentes son aristas, y la distancia es el peso.\n\n// Árbol de diálogo: grafo dirigido\n// Nodo \"Hola\" -> Nodo \"¿Qué necesitás?\" -> Nodo \"Comprar\"\n//                                        -> Nodo \"Salir\"\n// La conexión va en una sola dirección"},
    {t:"h2",v:"Cómo representar un grafo en código"},
    {t:"text",v:"La representación más común y flexible es la lista de adyacencia: un diccionario donde cada nodo tiene una lista de sus vecinos. Es eficiente en memoria para grafos dispersos (pocos edges) y permite iterar los vecinos de un nodo en O(grado del nodo)."},
    {t:"code",v:"// Lista de adyacencia: mapa de un dungeon\nDictionary<string, List<string>> dungeon = new Dictionary<string, List<string>>\n{\n    { \"Entrada\",   new List<string> { \"Pasillo1\", \"Pasillo2\" } },\n    { \"Pasillo1\",  new List<string> { \"Entrada\", \"SalaJefe\" } },\n    { \"Pasillo2\",  new List<string> { \"Entrada\", \"Tesoro\" } },\n    { \"SalaJefe\",  new List<string> { \"Pasillo1\" } },\n    { \"Tesoro\",    new List<string> { \"Pasillo2\" } }\n};\n\n// Vecinos de Entrada: O(1) lookup en el dict\nList<string> vecinos = dungeon[\"Entrada\"]; // [\"Pasillo1\", \"Pasillo2\"]"},
    {t:"call",label:"Lista vs Matriz de adyacencia",v:"Lista de adyacencia: eficiente en memoria cuando hay pocas conexiones por nodo (la mayoría de los mapas de juegos). Matriz de adyacencia: una grilla NxN de booleanos, útil cuando querés saber en O(1) si dos nodos específicos están conectados. Para mapas de juegos, la lista es casi siempre mejor."},
    {t:"h2",v:"Grafos que ya usás en Unity"},
    {t:"text",v:"La scene hierarchy de Unity es un grafo dirigido (árbol): cada GameObject tiene un padre y cero o más hijos, pero la conexión va solo hacia abajo. El NavMesh es un grafo ponderado que Unity Pathfinding recorre con A* (variante de BFS ponderado) para encontrar caminos. Los sistemas de animación (Animator) son grafos de estados donde las transiciones son aristas con condiciones."},
    {t:"call",label:"En una entrevista",v:"\"Un grafo es una estructura formada por nodos (vértices) y conexiones entre ellos (aristas). Puede ser dirigido o no dirigido, ponderado o no. La representación más común es la lista de adyacencia: un diccionario donde cada nodo mapea a su lista de vecinos. Se usa para modelar mapas, redes de caminos, árboles de diálogo, dependencias y cualquier sistema de relaciones entre entidades.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué es un grafo dirigido?",opts:["Un grafo donde todos los nodos tienen el mismo número de conexiones.","Un grafo donde las aristas tienen dirección: A->B no implica B->A.","Un grafo donde los nodos están ordenados por valor.","Un grafo sin ciclos."],correct:1,exp:"En un grafo dirigido, las aristas tienen dirección. Si existe una arista de A a B, eso no implica que haya una de B a A. Los árboles de diálogo son ejemplos: podés ir de 'Hola' a '¿Qué necesitás?' pero no volver por el mismo edge."},
    {id:"e2",type:"tf",q:"El NavMesh de Unity es un ejemplo de grafo en un sistema de juego real.",correct:true,exp:"Verdadero. El NavMesh es un grafo donde cada polígono navegable es un nodo y las conexiones entre polígonos adyacentes son aristas con un peso (la distancia). Unity Pathfinding recorre este grafo con A* para calcular el camino óptimo."},
    {id:"e3",type:"mc",q:"¿Cuál es la ventaja de representar un grafo con lista de adyacencia vs matriz de adyacencia?",opts:["La lista permite saber en O(1) si dos nodos específicos están conectados.","La lista es más eficiente en memoria cuando hay pocas conexiones por nodo.","La matriz ocupa menos memoria en todos los casos.","No hay diferencia práctica entre ambas."],correct:1,exp:"La lista de adyacencia usa memoria proporcional al número de aristas reales. La matriz usa O(n²) sin importar cuántas conexiones hay. Para mapas de juegos donde cada sala conecta con pocas otras, la lista es mucho más eficiente."},
    {id:"e4",type:"self",q:"Nombrá dos sistemas de un juego que sean grafos y explicá qué son los nodos y qué son las aristas en cada caso.",model:"Árbol de diálogo: los nodos son las líneas de diálogo o estados de la conversación, las aristas son las opciones de respuesta del jugador que llevan de un estado al siguiente. Sistema de quest con dependencias: los nodos son las quests, las aristas son las dependencias (la quest B requiere que la quest A esté completada antes). Otro ejemplo: mapa de un juego tipo MetroidVania donde los nodos son las habitaciones y las aristas son las puertas o pasajes entre ellas."}
   ]},
  {id:"algo-03",title:"BFS — Búsqueda en Anchura",sub:"Explorar nivel por nivel con una Queue",min:12,
   sections:[
    {t:"text",v:"BFS (Breadth-First Search) es un algoritmo que recorre un grafo nivel por nivel: primero visita todos los vecinos del nodo inicial, luego todos los vecinos de esos vecinos, y así sucesivamente. Su arma secreta es una Queue: explora en orden de llegada, lo que garantiza que siempre encuentra el camino más corto en grafos sin peso."},
    {t:"h2",v:"La mecánica del BFS"},
    {t:"text",v:"El algoritmo usa una Queue y un HashSet de nodos visitados. Empieza encolando el nodo inicial. En cada iteración, desencola un nodo, procesa sus vecinos no visitados, y los encola. Continúa hasta que la Queue está vacía o encontró lo que buscaba."},
    {t:"code",v:"// BFS: encontrar la sala más cercana con un cofre\nbool BFS(Dictionary<string, List<string>> dungeon, string start)\n{\n    Queue<string> queue = new Queue<string>();\n    HashSet<string> visited = new HashSet<string>();\n\n    queue.Enqueue(start);\n    visited.Add(start);\n\n    while (queue.Count > 0)\n    {\n        string current = queue.Dequeue();\n\n        if (HasChest(current))\n        {\n            Debug.Log(\"Cofre más cercano en: \" + current);\n            return true;  // Camino MÁS CORTO garantizado\n        }\n\n        foreach (string neighbor in dungeon[current])\n        {\n            if (!visited.Contains(neighbor))\n            {\n                visited.Add(neighbor);\n                queue.Enqueue(neighbor);\n            }\n        }\n    }\n    return false;  // No hay cofre en el dungeon\n}"},
    {t:"call",label:"Por qué garantiza el camino más corto",v:"BFS visita todos los nodos a distancia 1 antes de visitar los de distancia 2, y los de distancia 2 antes de los de distancia 3. Cuando encuentra algo, lo encontró en la menor cantidad de pasos posibles. DFS no garantiza esto porque puede explorar un camino muy largo antes de uno corto."},
    {t:"h2",v:"BFS en una grilla 2D"},
    {t:"text",v:"En juegos, BFS en grilla aparece constantemente: flood fill de pintura, propagación de fuego o veneno, área de efecto de una habilidad, verificar zonas conectadas. La grilla es un grafo donde cada celda es un nodo y sus 4 vecinos (arriba, abajo, izquierda, derecha) son las aristas."},
    {t:"code",v:"// Flood fill: marcar todas las celdas conectadas del mismo tipo\nvoid FloodFill(int[,] grid, int startRow, int startCol, int newColor)\n{\n    int originalColor = grid[startRow, startCol];\n    Queue<(int r, int c)> queue = new Queue<(int, int)>();\n    queue.Enqueue((startRow, startCol));\n\n    int[] dr = { -1, 1, 0, 0 };  // Direcciones: arriba, abajo\n    int[] dc = { 0, 0, -1, 1 };  // Direcciones: izquierda, derecha\n\n    while (queue.Count > 0)\n    {\n        var (r, c) = queue.Dequeue();\n        if (r < 0 || r >= grid.GetLength(0)) continue;\n        if (c < 0 || c >= grid.GetLength(1)) continue;\n        if (grid[r, c] != originalColor) continue;\n\n        grid[r, c] = newColor;  // Pintar\n\n        for (int i = 0; i < 4; i++)\n            queue.Enqueue((r + dr[i], c + dc[i]));\n    }\n}"},
    {t:"h2",v:"Complejidad"},
    {t:"text",v:"BFS tiene complejidad O(V + E) donde V es el número de vértices (nodos) y E el número de aristas (edges). En una grilla de NxN celdas, V = N² y E = ~4N², por lo que es efectivamente O(N²). Es lineal respecto al tamaño del grafo: visita cada nodo y cada arista exactamente una vez."},
    {t:"call",label:"En una entrevista",v:"\"BFS explora un grafo nivel por nivel usando una Queue. Visita todos los vecinos del nodo actual antes de avanzar más profundo. Garantiza el camino más corto en grafos no ponderados. Tiene complejidad O(V+E). Se usa para camino más corto, flood fill, propagación de efectos en área, y verificar conectividad entre nodos.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué estructura de datos es el núcleo del BFS?",opts:["Stack (pila)","Queue (cola)","Dictionary","Array fijo"],correct:1,exp:"BFS usa una Queue. Encola los vecinos de cada nodo en orden de descubrimiento y los procesa de adelante hacia atrás (FIFO). Esto garantiza que los nodos más cercanos al origen sean procesados primero, lo que produce el recorrido nivel por nivel."},
    {id:"e2",type:"tf",q:"BFS garantiza encontrar el camino más corto entre dos nodos en cualquier tipo de grafo.",correct:false,exp:"Falso. BFS garantiza el camino más corto en grafos NO PONDERADOS (donde todas las aristas tienen el mismo costo). En grafos ponderados (donde moverse de A a B puede costar más que de B a C), se necesita Dijkstra o A*."},
    {id:"e3",type:"mc",q:"¿Para qué se usa el HashSet<string> visited en BFS?",opts:["Para contar cuántos nodos hay en el grafo.","Para evitar procesar el mismo nodo más de una vez y entrar en bucles infinitos.","Para ordenar los nodos por distancia.","Para almacenar el camino encontrado."],correct:1,exp:"Sin visited, si el grafo tiene ciclos (lo que es muy común), BFS encolaría el mismo nodo infinitas veces. El HashSet registra qué nodos ya fueron procesados y evita reencolarlos, garantizando que cada nodo se visita exactamente una vez."},
    {id:"e4",type:"self",q:"Describí un caso de uso de BFS en un juego que no sea encontrar el camino más corto.",model:"Propagación de fuego en una grilla: cuando una celda se incendia, el fuego se propaga a las celdas adyacentes en cada turno. BFS modela esto perfectamente: en cada paso encola las celdas vecinas inflamables, que en el siguiente turno propagan a las suyas. El fuego se expande nivel por nivel, exactamente como BFS explora. Otro caso: calcular el área de efecto de una explosión en una grilla con obstáculos, donde el fuego no atraviesa paredes."}
   ]},
  {id:"algo-04",title:"DFS — Búsqueda en Profundidad",sub:"Explorar un camino hasta el fondo",min:12,
   sections:[
    {t:"text",v:"DFS (Depth-First Search) es un algoritmo que recorre un grafo yendo lo más profundo posible por cada rama antes de retroceder y explorar otra. Donde BFS usa una Queue para ir nivel por nivel, DFS usa un Stack (o recursión, que implícitamente usa el call stack) para ir rama por rama."},
    {t:"h2",v:"DFS recursivo"},
    {t:"text",v:"La versión recursiva de DFS es elegante y directa. En cada nodo: marcarlo como visitado, luego llamar a DFS recursivamente sobre cada vecino no visitado."},
    {t:"code",v:"// DFS: verificar si existe camino entre dos salas\nbool DFS(Dictionary<string, List<string>> dungeon,\n         string current, string target,\n         HashSet<string> visited)\n{\n    if (current == target) return true;  // Llegamos\n\n    visited.Add(current);\n\n    foreach (string neighbor in dungeon[current])\n    {\n        if (!visited.Contains(neighbor))\n        {\n            // Explorar esta rama hasta el fondo\n            if (DFS(dungeon, neighbor, target, visited))\n                return true;  // Propagá el éxito hacia arriba\n        }\n    }\n\n    return false;  // No hay camino por esta rama\n}\n\n// Uso:\nbool connected = DFS(dungeon, \"Entrada\", \"Tesoro\", new HashSet<string>());"},
    {t:"call",label:"BFS vs DFS",v:"BFS: nivel por nivel, garantiza camino más corto, usa Queue explícita, mejor para encontrar el mínimo de pasos. DFS: rama por rama, no garantiza el más corto, usa recursión o Stack, mejor para verificar si existe un camino, explorar todas las posibilidades o detectar ciclos."},
    {t:"h2",v:"DFS iterativo con Stack explícito"},
    {t:"code",v:"// DFS iterativo: misma lógica, sin recursión\nvoid DFSIterativo(Dictionary<string, List<string>> graph, string start)\n{\n    Stack<string> stack = new Stack<string>();\n    HashSet<string> visited = new HashSet<string>();\n\n    stack.Push(start);\n\n    while (stack.Count > 0)\n    {\n        string current = stack.Pop();\n\n        if (visited.Contains(current)) continue;\n        visited.Add(current);\n\n        Debug.Log(\"Visitando: \" + current);\n\n        foreach (string neighbor in graph[current])\n        {\n            if (!visited.Contains(neighbor))\n                stack.Push(neighbor);\n        }\n    }\n}"},
    {t:"h2",v:"DFS en Unity: recorrer la jerarquía"},
    {t:"code",v:"// Encontrar todos los scripts de un tipo en la jerarquía\n// (DFS recursivo sobre los Transform)\nvoid FindAll<T>(Transform node, List<T> results) where T : Component\n{\n    T component = node.GetComponent<T>();\n    if (component != null)\n        results.Add(component);\n\n    foreach (Transform child in node)\n        FindAll<T>(child, results);  // DFS en cada hijo\n}\n// GetComponentsInChildren<T>() hace exactamente esto"},
    {t:"h2",v:"Aplicaciones de DFS"},
    {t:"text",v:"DFS brilla para: detectar si dos nodos están conectados (¿hay camino del SpawnRoom al BossRoom?), encontrar todos los nodos alcanzables desde un punto, detectar ciclos en un grafo, ordenamiento topológico (en qué orden cargar recursos con dependencias), y como motor de backtracking para resolver puzzles (próxima lección)."},
    {t:"call",label:"En una entrevista",v:"\"DFS explora un grafo rama por rama, yendo lo más profundo posible antes de retroceder. Usa un Stack o recursión. No garantiza el camino más corto, pero es más eficiente en memoria que BFS para grafos muy anchos. Tiene complejidad O(V+E). Se usa para detectar conectividad, ciclos, ordenamiento topológico y como base del backtracking.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué estructura usa DFS para recorrer un grafo?",opts:["Queue (cola)","Stack (pila) o recursión","Dictionary","Lista ordenada"],correct:1,exp:"DFS usa un Stack (o la recursión, que implícitamente usa el call stack). El Stack permite que el algoritmo vaya por un camino hasta el fondo (LIFO: el último nodo encolado es el primero en explorarse), mientras que BFS usa Queue para nivel por nivel."},
    {id:"e2",type:"tf",q:"DFS garantiza encontrar el camino más corto entre dos nodos, igual que BFS.",correct:false,exp:"Falso. DFS puede tomar un camino muy largo antes de explorar uno corto, dependiendo del orden en que procesa los vecinos. Para garantizar el camino más corto en grafos no ponderados, se usa BFS."},
    {id:"e3",type:"mc",q:"¿Para qué caso es más adecuado DFS que BFS?",opts:["Encontrar el camino de menor cantidad de pasos entre dos nodos.","Verificar si existe algún camino entre dos nodos, sin importar cuál.","Propagar fuego nivel por nivel en una grilla.","Encontrar el vecino más cercano a un punto."],correct:1,exp:"DFS es ideal para verificar conectividad: ¿existe algún camino entre A y B? No necesitamos el más corto, solo saber si están conectados. DFS con recursión resuelve esto elegantemente y puede ser más eficiente en memoria que BFS para grafos muy anchos."},
    {id:"e4",type:"self",q:"Explicá la diferencia entre BFS y DFS en términos de orden de exploración y cuándo usarías cada uno.",model:"BFS explora nivel por nivel: primero todos los vecinos directos del nodo inicial, luego los vecinos de esos vecinos. Usa Queue. Garantiza el camino más corto en grafos no ponderados. Usalo cuando necesitás el mínimo de pasos: camino más corto, distancia mínima, propagación uniforme. DFS va rama por rama: sigue un camino hasta el fondo antes de retroceder. Usa Stack o recursión. No garantiza el más corto pero es más eficiente en memoria para grafos anchos. Usalo para: verificar si existe un camino, explorar todas las posibilidades, detectar ciclos, o como base del backtracking."}
   ]},
  {id:"algo-05",title:"Backtracking",sub:"Probar, fallar y retroceder",min:13,
   sections:[
    {t:"text",v:"Backtracking es una técnica para resolver problemas explorando todas las posibilidades de forma sistemática. La idea: construís una solución incrementalmente, y en cuanto sabés que una decisión no puede llevar a una solución válida, la deshacés (backtrack) y probás otra. Es DFS aplicado a espacios de búsqueda con decisiones."},
    {t:"h2",v:"El patrón de todo backtracking"},
    {t:"text",v:"Todo algoritmo de backtracking sigue la misma estructura de tres pasos: Elegir (hacer una decisión), Explorar (seguir construyendo la solución a partir de esa decisión), Deselegir (deshacer la decisión y probar otra). El tercer paso es lo que diferencia backtracking de DFS simple."},
    {t:"code",v:"// Patrón genérico de backtracking\nvoid Backtrack(Estado estado)\n{\n    if (EsSolucion(estado))  // Caso base: encontramos una solución\n    {\n        GuardarSolucion(estado);\n        return;\n    }\n\n    foreach (var opcion in ObtenerOpciones(estado))\n    {\n        if (EsValida(opcion, estado))  // Poda: descartá opciones imposibles\n        {\n            Elegir(opcion, estado);      // 1. ELEGIR\n            Backtrack(estado);           // 2. EXPLORAR\n            Deselegir(opcion, estado);   // 3. DESELEGIR (backtrack)\n        }\n    }\n}"},
    {t:"h2",v:"Ejemplo: resolver un laberinto"},
    {t:"code",v:"// Resolver un laberinto en una grilla: 0=libre, 1=pared\nbool SolveMaze(int[,] maze, int row, int col, bool[,] visited)\n{\n    int rows = maze.GetLength(0);\n    int cols = maze.GetLength(1);\n\n    // Casos base: fuera de límites, pared, o ya visitado\n    if (row < 0 || row >= rows || col < 0 || col >= cols) return false;\n    if (maze[row, col] == 1 || visited[row, col]) return false;\n\n    // Llegamos a la salida (esquina inferior derecha)\n    if (row == rows - 1 && col == cols - 1) return true;\n\n    visited[row, col] = true;   // ELEGIR: marcar como visitado\n\n    // EXPLORAR: probar las 4 direcciones\n    if (SolveMaze(maze, row + 1, col, visited)) return true;\n    if (SolveMaze(maze, row - 1, col, visited)) return true;\n    if (SolveMaze(maze, row, col + 1, visited)) return true;\n    if (SolveMaze(maze, row, col - 1, visited)) return true;\n\n    visited[row, col] = false;  // DESELEGIR: backtrack\n    return false;\n}"},
    {t:"call",label:"La poda: la clave de la eficiencia",v:"Sin poda, backtracking explora el espacio completo de posibilidades (que puede ser enorme). La poda descarta ramas imposibles antes de explorarlas. En el laberinto: si la celda es una pared o ya fue visitada, no hay que explorarla. En un puzzle de 9x9 (Sudoku), la poda puede reducir las opciones de billones a miles."},
    {t:"h2",v:"Backtracking en juegos"},
    {t:"code",v:"// Generar combinaciones de items para un slot de equipo\nvoid FindCombos(List<Item> available, List<Item> current,\n                int slots, List<List<Item>> results)\n{\n    if (current.Count == slots)  // Combinación completa\n    {\n        results.Add(new List<Item>(current));\n        return;\n    }\n\n    for (int i = 0; i < available.Count; i++)\n    {\n        Item item = available[i];\n        if (current.Contains(item)) continue;  // Poda: no repetir\n\n        current.Add(item);                // ELEGIR\n        FindCombos(available, current, slots, results);  // EXPLORAR\n        current.RemoveAt(current.Count - 1); // DESELEGIR\n    }\n}"},
    {t:"text",v:"Backtracking aparece en la generación procedural de niveles (colocar salas sin que se superpongan), en la IA de puzzles (resolver Sudoku, N-Queens), en la validación de reglas de juego, y en sistemas de planificación de comportamiento de NPCs."},
    {t:"call",label:"En una entrevista",v:"\"Backtracking es una técnica que construye soluciones incrementalmente, probando cada opción posible y deshaciendo la decisión (backtrack) cuando lleva a un callejón sin salida. Sigue el patrón Elegir-Explorar-Deselegir. Su eficiencia depende de la poda: detectar ramas inválidas lo antes posible. Se usa en resolución de puzzles, generación procedural y búsqueda en espacios de decisiones.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué distingue al backtracking de un DFS simple?",opts:["Backtracking usa una Queue en lugar de un Stack.","Backtracking deshace las decisiones (Deselegir) cuando una rama no lleva a solución.","Backtracking garantiza el camino más corto.","Backtracking solo funciona en grafos sin ciclos."],correct:1,exp:"El paso de Deselegir es lo que define al backtracking: no solo explora todas las ramas (como DFS), sino que deshace cada decisión al retroceder. Esto permite explorar el espacio completo de posibilidades de forma sistemática sin estados 'sucios' de exploraciones anteriores."},
    {id:"e2",type:"tf",q:"La poda en backtracking es opcional y solo afecta la legibilidad del código, no el rendimiento.",correct:false,exp:"Falso. La poda es crítica para el rendimiento. Sin poda, el backtracking puede explorar un espacio exponencial de posibilidades. Con buena poda, se descartan ramas enteras antes de explorarlas, reduciendo el tiempo de ejecución de billones de operaciones a miles en problemas como Sudoku."},
    {id:"e3",type:"mc",q:"¿Cuál es el patrón de los tres pasos del backtracking?",opts:["Inicializar, Procesar, Finalizar","Buscar, Comparar, Ordenar","Elegir, Explorar, Deselegir","Encolar, Desencolar, Verificar"],correct:2,exp:"Elegir (tomar una decisión), Explorar (seguir construyendo la solución a partir de esa decisión), Deselegir (deshacer la decisión y probar otra). El tercer paso, Deselegir, es el que hace el 'backtrack' y permite explorar sistemáticamente todas las posibilidades."},
    {id:"e4",type:"self",q:"Describí cómo aplicarías backtracking para generar un dungeon procedural donde las salas no pueden superponerse.",model:"Cada sala intenta colocarse en una posición del grid. El algoritmo elige una posición para la próxima sala, verifica que no se superponga con las ya colocadas (poda), la coloca (Elegir), intenta colocar las salas restantes recursivamente (Explorar), y si en algún momento no hay posición válida disponible para una sala, elimina la última sala colocada (Deselegir) y prueba otra posición. El resultado es un layout donde todas las salas tienen una posición válida, o el reporte de que no existe layout válido con esas restricciones."}
   ]}
  ]
}
,{
  id:"os",title:"Sistemas Operativos y Concurrencia",
  desc:"Procesos, hilos, memoria y por qué Unity vive en el main thread",icon:"⚙",
  lessons:[
  {id:"os-01",title:"Procesos e Hilos",sub:"Las unidades básicas de ejecución",min:11,
   sections:[
    {t:"text",v:"Cuando ejecutás tu juego, el sistema operativo crea un proceso: un programa en ejecución con su propio espacio de memoria. Dentro de ese proceso pueden correr múltiples hilos (threads): unidades de ejecución independientes que comparten la memoria del proceso pero avanzan por separado."},
    {t:"h2",v:"El proceso y el hilo"},
    {t:"text",v:"Un proceso es un programa en ejecución con memoria aislada del resto del sistema. Un hilo es la unidad de ejecución dentro de un proceso. Un proceso puede tener múltiples hilos corriendo en paralelo (en distintos núcleos de CPU) o alternados muy rápido (en un solo núcleo). Todos los hilos de un proceso comparten el mismo heap."},
    {t:"code",v:"// Crear un thread en C# para trabajo pesado\nusing System.Threading;\n\nprivate float[] _result;\nprivate bool _resultReady = false;\n\nvoid StartHeavyWork(float[] data)\n{\n    Thread thread = new Thread(() =>\n    {\n        // BIEN: trabajo de CPU puro, sin tocar Unity API\n        _result = HeavyComputation(data);\n\n        // MAL: esto lanza excepción\n        // transform.position = Vector3.zero;\n\n        _resultReady = true; // Señal para el main thread\n    });\n    thread.Start();\n}\n\nvoid Update()\n{\n    if (_resultReady)\n    {\n        _resultReady = false;\n        ApplyResult(_result); // Aquí sí se toca Unity API\n    }\n}"},
    {t:"call",label:"Unity y el main thread",v:"Unity es single-threaded por diseño: toda su API (GameObjects, Transform, Rigidbody, Instantiate, Destroy) debe llamarse desde el main thread. Si lo intentás desde otro thread, obtenés una excepción en runtime. La restricción existe para evitar race conditions en el estado del juego. Los threads secundarios sirven para trabajo de CPU puro: pathfinding, generación procedural, procesamiento de datos."},
    {t:"call",label:"En una entrevista",v:"\"Un proceso es un programa en ejecución con su propio espacio de memoria aislado. Un hilo es una unidad de ejecución dentro de un proceso; múltiples hilos comparten el heap del proceso. En Unity, la API del engine solo es accesible desde el main thread. Los threads secundarios se usan para trabajo de CPU puro, devolviendo resultados al main thread mediante variables compartidas o callbacks.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué diferencia principal existe entre un proceso y un hilo?",opts:["Un proceso puede ejecutarse y un hilo no.","Un proceso tiene memoria aislada del sistema; un hilo comparte la memoria del proceso al que pertenece.","Un hilo es más lento que un proceso.","Un proceso solo puede tener un hilo."],correct:1,exp:"Un proceso tiene su propio espacio de memoria aislado del resto del sistema: si crashea, no corrompe la memoria de otros. Los hilos viven dentro de un proceso y comparten su heap, lo que los hace más livianos de crear pero requiere sincronización si acceden a datos compartidos."},
    {id:"e2",type:"tf",q:"En Unity, podés modificar transform.position desde un thread secundario sin problemas.",correct:false,exp:"Falso. La API de Unity (GameObjects, Transform, Rigidbody, etc.) solo es segura desde el main thread. Acceder desde un thread secundario lanza una excepción en runtime. Unity lo hace así para garantizar que el estado del juego no sea modificado por múltiples threads simultáneamente."},
    {id:"e3",type:"mc",q:"¿Cuál es el patrón correcto para usar un thread secundario en Unity?",opts:["Pasar el Transform al thread y modificarlo directamente.","El thread hace trabajo de CPU puro, guarda el resultado en una variable, y el main thread lo aplica a Unity en Update().","Usar StartCoroutine() en lugar de Thread para trabajo paralelo.","No es posible usar threads secundarios en Unity."],correct:1,exp:"El patrón seguro: el thread secundario realiza trabajo de CPU puro (sin tocar la API de Unity), guarda el resultado en una variable compartida y activa un flag. El main thread revisa ese flag en Update() y, si está activo, aplica el resultado a los GameObjects. El thread nunca toca Unity."},
    {id:"e4",type:"self",q:"Describí un escenario en Unity donde un thread secundario tiene sentido, y explicá cómo pasarías el resultado al main thread.",model:"Generación procedural de terreno: calcular la geometría de un chunk de terreno es trabajo de CPU puro (matemáticas, ruido de Perlin, construcción de arrays de vértices) que puede llevar decenas de ms. Un thread secundario hace ese cálculo y guarda el MeshData en una variable. El main thread verifica en Update() si el MeshData está listo, y si es así, llama a mesh.SetVertices() y mesh.SetTriangles() que son operaciones de Unity y deben ir en el main thread. Resultado: el juego no se congela mientras genera el terreno."}
   ]},
  {id:"os-02",title:"Stack vs Heap",sub:"Dónde viven los datos en memoria",min:12,
   sections:[
    {t:"text",v:"Cuando un programa corre, usa dos regiones principales de memoria: el Stack y el Heap. Entender la diferencia importa para el rendimiento, el debugging y para saber por qué value types y reference types se comportan diferente en C# al asignarlos o pasarlos como argumentos."},
    {t:"h2",v:"El Stack"},
    {t:"text",v:"El Stack es rápido, de tamaño limitado y con gestión automática. Cada vez que entrás a una función, se apila un frame con sus variables locales. Cuando la función retorna, el frame se desapila y esa memoria queda libre instantáneamente, sin Garbage Collector. Los value types (int, float, bool, struct) viven aquí cuando son variables locales."},
    {t:"code",v:"void Example()\n{\n    int health = 100;        // Stack\n    float speed = 5.0f;     // Stack\n    Vector3 pos = Vector3.zero; // struct -> Stack\n\n    int a = 10;\n    int b = a;   // b es una COPIA independiente\n    b = 20;\n    Debug.Log(a); // 10 -- b y a son independientes\n} // Al salir: health, speed, pos, a, b se limpian solos"},
    {t:"h2",v:"El Heap"},
    {t:"text",v:"El Heap es más grande y flexible, pero su gestión corre por cuenta del Garbage Collector. Los objetos creados con new de tipos referencia (class, array, List, string) viven aquí. Múltiples variables pueden apuntar al mismo objeto: no copian el objeto, copian la referencia."},
    {t:"code",v:"class Enemy { public int health; }\n\nvoid Example()\n{\n    Enemy e1 = new Enemy { health = 100 }; // Objeto en el HEAP\n    Enemy e2 = e1;   // e2 apunta al MISMO objeto en heap\n\n    e2.health = 50;\n    Debug.Log(e1.health); // 50 -- misma referencia, mismo objeto\n\n    // Otros reference types en heap:\n    List<int> list = new List<int>(); // Heap\n    int[] arr = new int[10];          // Heap\n    string name = \"Player\";           // Heap\n}"},
    {t:"call",label:"Value type vs Reference type",v:"Value type (struct, int, float, bool, Vector3): se COPIA al asignar o pasar como argumento. Cada variable tiene su propia copia del dato. Reference type (class, array, List, string): al asignar, se copia la REFERENCIA, no el objeto. Varias variables pueden apuntar al mismo objeto en el heap."},
    {t:"h2",v:"Boxing: la trampa de rendimiento"},
    {t:"text",v:"Boxing ocurre cuando un value type es tratado como object, forzándolo al heap. Cada boxing es una allocación. En código de juego que corre 60 veces por segundo, boxing repetido genera miles de objetos efímeros que el GC eventualmente limpia, causando pauses."},
    {t:"code",v:"// Boxing: wrappear un value type como object\nint hp = 100;\nobject boxed = hp;     // BOXING: allocación en heap\nint val = (int)boxed;  // UNBOXING\n\n// Trampa clásica: colecciones no genéricas (evitar)\nArrayList oldList = new ArrayList();\noldList.Add(42);  // Boxing del int -> allocación\n\n// Bien: genéricos, sin boxing\nList<int> goodList = new List<int>();\ngoodList.Add(42);  // Sin boxing, int va directo"},
    {t:"call",label:"En una entrevista",v:"\"El Stack almacena variables locales y frames de funciones: es rápido y de gestión automática. El Heap almacena objetos dinámicos (reference types) y es gestionado por el Garbage Collector. Value types se copian al asignar; reference types comparten la referencia. Boxing es wrappear un value type como object, forzando una allocación en el heap que genera GC pressure.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Dónde vive un int declarado como variable local dentro de un método en C#?",opts:["En el heap, gestionado por el Garbage Collector.","En el stack, liberado automáticamente cuando el método retorna.","En la memoria estática del programa.","Depende de su valor."],correct:1,exp:"Las variables locales de value types (int, float, bool, struct) se almacenan en el stack frame del método actual. Cuando el método retorna, el frame se desapila y esa memoria queda disponible automáticamente, sin intervención del GC."},
    {id:"e2",type:"tf",q:"Si tengo Enemy e1 = new Enemy() y luego Enemy e2 = e1, modificar e2.health también cambia e1.health.",correct:true,exp:"Verdadero. Enemy es un class (reference type). Al hacer e2 = e1, e2 no copia el objeto: copia la referencia. Ambas variables apuntan al mismo objeto en el heap. Cualquier modificación a través de e2 se refleja al leer a través de e1."},
    {id:"e3",type:"mc",q:"¿Qué es el boxing y por qué es problemático en bucles de Update()?",opts:["Una técnica para organizar el heap eficientemente.","Wrappear un value type como object, creando una allocación en el heap en cada operación.","Un error de compilación al mezclar int con float.","Una forma de pasar structs entre threads."],correct:1,exp:"Boxing crea un nuevo objeto en el heap cada vez que ocurre. En Update() a 60fps, boxing repetido genera decenas de allocaciones por segundo. El GC eventualmente las limpia, pero durante esa limpieza puede pausar el juego varios ms, causando stutters visibles en pantalla."},
    {id:"e4",type:"self",q:"¿Por qué Vector3 es un struct en Unity en lugar de una class, y qué consecuencias prácticas tiene eso?",model:"Vector3 es struct (value type) para evitar presión sobre el GC en código que usa muchos vectores. Como struct, se copia por valor al asignar: transform.position = newPos copia los tres floats directamente. Si fuera class, cada asignación compartiría la referencia y modificar la variable local modificaría el Transform. La consecuencia práctica: si hacés Vector3 temp = transform.position y modificás temp, el Transform NO cambia. Tenés que re-asignar explícitamente transform.position = temp. Esto confunde a mucha gente hasta que entiende value vs reference type."}
   ]},
  {id:"os-03",title:"Race Conditions y Sincronización",sub:"Cuando dos hilos tocan lo mismo",min:11,
   sections:[
    {t:"text",v:"Una race condition ocurre cuando dos o más hilos modifican el mismo dato compartido sin sincronización, y el resultado depende del timing de ejecución. Es uno de los bugs más difíciles de reproducir porque solo aparece bajo ciertas condiciones de scheduling del OS que no son predecibles."},
    {t:"h2",v:"El problema: una operación que no es atómica"},
    {t:"code",v:"// _score += points parece una operación, pero el CPU hace 3 pasos:\n// 1. Leer _score   (Thread 1 lee 100, Thread 2 también lee 100)\n// 2. Calcular suma  (Thread 1: 100+10=110, Thread 2: 100+10=110)\n// 3. Escribir       (Thread 1 escribe 110, Thread 2 escribe 110)\n//\n// Resultado: 110 en lugar de 120. Un punto se perdió.\n\nprivate int _score = 0;\n\nvoid AddScore(int points)\n{\n    _score += points; // NO seguro en multithreading\n}"},
    {t:"h2",v:"La solución: lock"},
    {t:"text",v:"lock(obj) en C# garantiza exclusión mutua: solo un thread a la vez puede ejecutar el bloque protegido. Si Thread 2 intenta entrar mientras Thread 1 está adentro, espera hasta que Thread 1 salga. El objeto pasado actúa como llave."},
    {t:"code",v:"private int _score = 0;\nprivate readonly object _lock = new object();\n\nvoid AddScore(int points)\n{\n    lock (_lock) // Solo un thread entra a la vez\n    {\n        _score += points; // Ahora sí es seguro\n    } // Al salir libera el lock\n}\n\nint GetScore()\n{\n    lock (_lock) { return _score; } // Leer también requiere lock\n}"},
    {t:"call",label:"Deadlock: el otro peligro",v:"Un deadlock ocurre cuando Thread A espera el lock de Thread B, y Thread B espera el lock de Thread A. Ambos se bloquean para siempre. Regla para evitarlo: siempre adquirir los locks en el mismo orden en todos los threads. Si todos hacen lockA antes que lockB, el deadlock es imposible."},
    {t:"h2",v:"La solución de Unity: evitar el problema de raíz"},
    {t:"text",v:"Unity resuelve las race conditions de manera elegante: simplemente no permite que su API sea accedida desde threads secundarios. Todo el estado del juego (GameObjects, componentes, escena) vive en el main thread. Los threads secundarios solo tocan datos puros que el dev controla explícitamente. Esto elimina la necesidad de sincronizar el estado del engine."},
    {t:"code",v:"// volatile para flags booleanos simples (evita cache de CPU)\npublic volatile bool IsComplete = false;\n\n// Para datos complejos, usar lock:\nprivate readonly object _dataLock = new object();\nprivate float[] _sharedData;\n\nvoid WriteFromThread(float[] data)\n{\n    lock (_dataLock) { _sharedData = data; }\n}\n\nfloat[] ReadFromMain()\n{\n    lock (_dataLock) { return _sharedData; }\n}"},
    {t:"call",label:"En una entrevista",v:"\"Una race condition ocurre cuando múltiples threads acceden y modifican datos compartidos sin sincronización, produciendo resultados no deterministas. En C#, lock(obj) garantiza exclusión mutua: solo un thread ejecuta el bloque protegido a la vez. Un deadlock ocurre cuando dos threads esperan mutuamente el lock del otro. Unity evita estos problemas en su API restringiéndola al main thread.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Por qué _score += points no es thread-safe?",opts:["Porque += no funciona con campos de clase.","Porque es tres operaciones separadas (leer, calcular, escribir) que pueden ser interrumpidas entre sí por otro thread.","Porque los threads no pueden usar +=.","Porque _score debería ser static."],correct:1,exp:"_score += points parece atómica pero el CPU la ejecuta en tres pasos: leer el valor actual, calcular la suma, escribir el resultado. Si otro thread lee entre el paso 1 y el paso 3 del primero, ambos calculan con el valor viejo y uno de los incrementos se pierde silenciosamente."},
    {id:"e2",type:"tf",q:"Un deadlock puede ocurrir con un solo thread si intenta adquirir el mismo lock dos veces.",correct:true,exp:"Verdadero. Si un thread ya tiene un lock y vuelve a intentar adquirirlo (en una llamada recursiva por ejemplo), se bloquea esperando que se libere, lo que nunca ocurre porque él mismo lo tiene. Esto es deadlock por reentrada. C# tiene Monitor.Enter con parámetro lockTaken para manejar este caso."},
    {id:"e3",type:"mc",q:"¿Cuál es la estrategia principal de Unity para evitar race conditions en su API?",opts:["Usa lock() internamente en todas sus operaciones.","Restringe el acceso a su API al main thread, evitando que múltiples threads compitan por el estado del juego.","Usa volatile para todos los componentes.","Duplica el estado del juego para cada thread."],correct:1,exp:"Unity no permite que su API sea llamada desde threads secundarios. Al hacer que el acceso a GameObjects, Transform, etc. sea exclusivo del main thread, elimina la necesidad de sincronización compleja del estado del engine. Los threads secundarios hacen trabajo puro y el main thread aplica los resultados."},
    {id:"e4",type:"self",q:"Describí una race condition concreta en un juego y cómo la resolverías con lock.",model:"Ejemplo: un juego multijugador servidor-side donde dos jugadores atacan al mismo enemigo simultáneamente en threads separados. El enemigo tiene 10 HP. Thread 1 lee 10, Thread 2 lee 10, Thread 1 resta 8 y escribe 2, Thread 2 también calcula 10-8=2 y escribe 2. El enemigo debería estar muerto (-6 HP) pero queda con 2 HP. Solución: lock(_enemyLock) en el método TakeDamage del enemigo, garantizando que los ataques se procesen uno a la vez. Con lock, Thread 2 espera hasta que Thread 1 termine: lee 2 HP, resta 8, escribe -6, el enemigo muere correctamente."}
   ]},
  {id:"os-04",title:"Coroutines y Async/Await",sub:"Concurrencia sin bloquear el juego",min:13,
   sections:[
    {t:"text",v:"Muchas operaciones en un juego necesitan tiempo: spawn gradual de enemigos, fade de pantalla, carga de assets. Si las hacés síncronas, el juego se congela mientras esperan. Si usás threads, tenés que sincronizar el acceso a Unity. Las soluciones: coroutines para timing dentro del juego, async/await para I/O externo."},
    {t:"h2",v:"Coroutines de Unity"},
    {t:"text",v:"Una coroutine es una función que puede pausarse en puntos yield y resumirse después, todo en el main thread. No son threads reales: el juego sigue corriendo mientras la coroutine espera. Son cooperativas: la coroutine decide cuándo ceder el control de vuelta al engine."},
    {t:"code",v:"// Coroutine: spawn gradual con delay\nIEnumerator SpawnWave(int count)\n{\n    for (int i = 0; i < count; i++)\n    {\n        Instantiate(enemyPrefab, GetSpawnPoint(), Quaternion.identity);\n        yield return new WaitForSeconds(0.5f); // Pausa SIN congelar\n        // Update(), Physics y rendering siguen corriendo\n    }\n    Debug.Log(\"Oleada completa\");\n}\n\n// Iniciar\nStartCoroutine(SpawnWave(10));\n\n// Iniciar y poder detener después\nCoroutine wave = StartCoroutine(SpawnWave(10));\nStopCoroutine(wave);"},
    {t:"call",label:"Opciones de yield",v:"yield return null: resume en el próximo frame. yield return new WaitForSeconds(t): resume después de t segundos. yield return new WaitForFixedUpdate(): resume tras el próximo FixedUpdate. yield return new WaitUntil(() => condición): resume cuando la condición es true. yield return StartCoroutine(Otra()): espera a que termine otra coroutine."},
    {t:"h2",v:"async/await en C#"},
    {t:"text",v:"async/await es el mecanismo de C# para operaciones asíncronas reales: llamadas a APIs, lectura de disco, operaciones de red. A diferencia de las coroutines, no está limitado al engine: funciona con HttpClient, File, Task.Run para background threads, y con UnityWebRequest."},
    {t:"code",v:"// async/await: cargar datos de una API\npublic async Task<PlayerData> LoadPlayerAsync(string id)\n{\n    using HttpClient client = new HttpClient();\n\n    // NO bloquea el main thread mientras espera\n    string json = await client.GetStringAsync(\"https://api.game.com/\" + id);\n\n    return JsonUtility.FromJson<PlayerData>(json);\n}\n\n// Task.Run: mover trabajo pesado a un thread del pool\nasync void ProcessData()\n{\n    float[] data = await Task.Run(() => HeavyComputation(rawData));\n    // De vuelta en el main thread aquí:\n    ApplyToMesh(data); // Seguro tocar Unity API\n}\n\nasync void Start()\n{\n    PlayerData pd = await LoadPlayerAsync(\"user_123\");\n    UpdateUI(pd); // Main thread, seguro\n}"},
    {t:"h2",v:"¿Cuándo usar cada uno?"},
    {t:"code",v:"// COROUTINE: lógica de juego con timing\n// - Spawn gradual, fade in/out, delays de gameplay\n// - Secuencias de eventos, cutscenes por código\n// - Esperar condiciones del juego (WaitUntil)\n\n// ASYNC/AWAIT: operaciones externas e I/O\n// - Requests HTTP (leaderboards, login, guardado en la nube)\n// - Lectura/escritura de archivos grandes\n// - Carga de assets en background (Task.Run)\n\n// REGLA PRÁCTICA:\n// ¿Involucra timing dentro del juego? -> Coroutine\n// ¿Involucra esperar algo externo al engine? -> async/await"},
    {t:"call",label:"En una entrevista",v:"\"Una coroutine es una función que puede pausarse en puntos yield y resumirse después, todo en el main thread. No son threads: el juego sigue corriendo durante el yield. Se usan para timing y secuencias dentro del juego. async/await es el mecanismo de C# para I/O asíncrono real: permite que el main thread no se bloquee esperando respuestas externas. Task.Run mueve trabajo de CPU al ThreadPool.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿En qué hilo se ejecuta una Coroutine de Unity?",opts:["En un thread secundario del sistema operativo.","En el main thread, pausándose en los puntos yield.","En un thread del ThreadPool de C#.","En un thread separado por cada coroutine activa."],correct:1,exp:"Las Coroutines corren en el main thread. No son threads: son funciones que Unity ejecuta parcialmente cada frame, avanzando hasta el próximo yield. Por eso podés acceder a la API de Unity dentro de una coroutine sin problemas de threading."},
    {id:"e2",type:"tf",q:"yield return new WaitForSeconds(2f) dentro de una coroutine congela el juego durante 2 segundos.",correct:false,exp:"Falso. WaitForSeconds pausa la ejecución de esa coroutine durante 2 segundos, pero el resto del juego sigue corriendo normalmente: Update(), Physics, rendering, otras coroutines. Eso es la ventaja central sobre Thread.Sleep(2000) que sí congela el thread completo."},
    {id:"e3",type:"mc",q:"¿Para qué escenario es más apropiado async/await que una Coroutine?",opts:["Hacer un fade out de pantalla en 1 segundo.","Hacer un request HTTP a un servidor de leaderboards.","Spawnear 20 enemigos de a uno con delay.","Esperar a que el jugador presione un botón."],correct:1,exp:"Un request HTTP es I/O externo: async/await es la herramienta correcta porque puede liberar el thread durante la espera de la respuesta del servidor, maneja excepciones de red limpiamente, y es la forma estándar de I/O asíncrono en .NET. Las coroutines no tienen acceso nativo a HttpClient."},
    {id:"e4",type:"self",q:"Describí la diferencia entre yield return null y yield return new WaitForSeconds(1f) y cuándo usarías cada uno.",model:"yield return null pausa la coroutine por exactamente un frame y resume al inicio del siguiente Update. Se usa para distribuir trabajo pesado entre frames (procesar 100 items, 10 por frame para no hacer lag en un solo frame) o cuando necesitás esperar que algo cambie en el próximo ciclo del engine. yield return new WaitForSeconds(1f) pausa exactamente 1 segundo real, independientemente de cuántos frames pasen. Se usa para delays de gameplay: tiempo entre spawns de enemigos, cooldowns, delays de UI, tiempo entre oleadas."}
   ]},
  {id:"os-05",title:"El Garbage Collector",sub:"Memoria automática y sus costos",min:12,
   sections:[
    {t:"text",v:"C# gestiona la memoria automáticamente: cuando nadie referencia un objeto, el Garbage Collector lo elimina y libera esa memoria. Es conveniente comparado con C++ donde gestionás todo manualmente, pero tiene un costo: el GC corre periódicamente y puede causar pauses visibles si generás demasiados objetos efímeros."},
    {t:"h2",v:"Cómo funciona el GC de .NET"},
    {t:"text",v:"El GC usa un sistema de generaciones. Los objetos nuevos van a Generación 0. Si sobreviven una colección, suben a Gen 1, luego a Gen 2. El GC colecta Gen 0 frecuentemente (rápido), Gen 1 ocasionalmente, y Gen 2 raramente (la más costosa, puede durar varios ms). El problema en juegos: un GC de Gen 2 puede causar un stutter de varios frames."},
    {t:"code",v:"// MAL: allocaciones en cada frame\nvoid Update()\n{\n    // Cada concatenación crea un string nuevo en el heap\n    string msg = \"HP: \" + playerHP + \"/\" + maxHP;  // 2 strings efímeros\n\n    // LINQ crea un IEnumerable y una List<Enemy> efímeros\n    var alive = enemies.Where(e => e.health > 0).ToList();\n\n    // new Vector3 NO aloca (es struct), pero new Vector3[] SÍ\n    Vector3[] path = new Vector3[10]; // Heap allocation\n}"},
    {t:"call",label:"La regla de oro: no new en Update",v:"Cada new de un class, string, array, List, o resultado de ToList()/LINQ es una allocación en el heap. A 60fps, una sola allocación por Update son 60 por segundo, 3600 por minuto. El GC eventualmente limpia todo eso con un pause. La regla: evitar allocaciones en métodos que corren cada frame: Update, FixedUpdate, LateUpdate."},
    {t:"h2",v:"Object Pooling: reutilizar en lugar de crear"},
    {t:"code",v:"public class BulletPool : MonoBehaviour\n{\n    [SerializeField] private GameObject bulletPrefab;\n    private Queue<GameObject> _pool = new Queue<GameObject>();\n\n    private void Awake()\n    {\n        // Pre-popular el pool al inicio\n        for (int i = 0; i < 20; i++)\n        {\n            GameObject b = Instantiate(bulletPrefab);\n            b.SetActive(false);\n            _pool.Enqueue(b);\n        }\n    }\n\n    public GameObject Get()\n    {\n        if (_pool.Count > 0)\n        {\n            var b = _pool.Dequeue();\n            b.SetActive(true);\n            return b;  // Sin allocación\n        }\n        return Instantiate(bulletPrefab); // Solo si pool agotado\n    }\n\n    public void Return(GameObject b)\n    {\n        b.SetActive(false);\n        _pool.Enqueue(b); // Recyclar, sin Destroy\n    }\n}"},
    {t:"h2",v:"Otras prácticas para reducir GC pressure"},
    {t:"code",v:"// 1. Cachear GetComponent en Start, no llamarlo en Update\nprivate Rigidbody _rb;\nvoid Start() { _rb = GetComponent<Rigidbody>(); }\nvoid Update() { _rb.AddForce(direction); } // Sin allocación\n\n// 2. StringBuilder para strings dinámicos\nStringBuilder _sb = new StringBuilder();\nvoid UpdateHpText()\n{\n    _sb.Clear();\n    _sb.Append(\"HP: \");\n    _sb.Append(playerHP);\n    hpText.text = _sb.ToString(); // Una allocación, no varias\n}\n\n// 3. NonAlloc variants de Unity\nprivate Collider[] _hits = new Collider[20]; // Pre-allocado una vez\nvoid Update()\n{\n    // No crea array: usa el pre-allocado\n    int count = Physics.OverlapSphereNonAlloc(pos, radius, _hits);\n    for (int i = 0; i < count; i++) Process(_hits[i]);\n}"},
    {t:"call",label:"En una entrevista",v:"\"El Garbage Collector en .NET gestiona automáticamente la memoria de objetos en el heap usando un sistema de generaciones. Las colecciones de GC pueden causar pauses (stutters) en juegos. Las mejores prácticas: object pooling para objetos frecuentes, evitar allocaciones en Update() (sin new, sin LINQ con ToList, sin concatenación de strings), cachear referencias de GetComponent, y usar las variantes NonAlloc de Unity como OverlapSphereNonAlloc.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Por qué crear un new string en Update() es problemático?",opts:["Los strings son inmutables y no pueden usarse en Update().","Genera una allocación en el heap en cada frame; a 60fps el GC acumula miles de strings efímeros y eventualmente pausa el juego para limpiarlos.","Los strings no son gestionados por el GC.","Unity no permite crear strings en runtime."],correct:1,exp:"Strings en C# son immutables reference types: cada concatenación o new string genera un objeto nuevo en el heap. En Update() a 60fps, una concatenación por frame son 60 allocaciones por segundo. El GC las limpia periódicamente, pero durante esa limpieza puede pausar el juego varios ms, produciendo un stutter visible."},
    {id:"e2",type:"tf",q:"Object pooling reduce las allocaciones porque reutiliza objetos en lugar de crearlos y destruirlos.",correct:true,exp:"Verdadero. Object pooling crea los objetos una sola vez (o muy pocas) y los reutiliza: en lugar de Instantiate() y Destroy() (que generan allocaciones y GC work), los objetos se desactivan con SetActive(false) y se devuelven al pool. A lo largo del tiempo de juego, el número de allocaciones se mantiene mínimo."},
    {id:"e3",type:"mc",q:"¿Cuál es la ventaja de Physics.OverlapSphereNonAlloc sobre Physics.OverlapSphere?",opts:["OverlapSphereNonAlloc es más precisa geométricamente.","OverlapSphereNonAlloc usa un array pre-allocado en lugar de crear uno nuevo en cada llamada, evitando allocaciones en el heap.","OverlapSphereNonAlloc detecta más objetos simultáneamente.","No hay diferencia práctica."],correct:1,exp:"Physics.OverlapSphere crea y devuelve un nuevo Collider[] en cada llamada: una allocación por frame si se usa en Update. OverlapSphereNonAlloc recibe un array pre-allocado y lo llena sin crear ningún objeto. La variante NonAlloc existe exactamente para eliminar GC pressure en detección de colisiones frecuente."},
    {id:"e4",type:"self",q:"Diseñá un object pool para proyectiles en un shooter de alta cadencia. ¿Cuándo pre-populás el pool y cuántos proyectiles ponés?",model:"Pre-popular en Awake() con la cantidad máxima de balas que pueden estar activas simultáneamente: si el arma dispara 10 balas por segundo y cada bala dura 2 segundos máximo, el pool necesita 20 balas. Si el juego tiene múltiples armas, sumás sus capacidades. En Awake(), Instantiate 20 balas, SetActive(false) en cada una, y Enqueue en el pool. En Fire(), Get() del pool; si está vacío, Instantiate una nueva (el pool se auto-expande). En OnHit() o OnExitBounds(), Return() al pool. Resultado: después de los primeros disparos, cero allocaciones sin importar la cadencia de fuego."}
   ]}
  ]
}


]};

// ── STATE ──────────────────────────────────────────────────────────────────
let S={view:'home',modId:null,lesId:null,exIdx:0,answers:[],answered:false,sel:null,ttsMode:null,ttsSecIdx:null,ttsOn:false,ttsSpd:1.0};
let PROG={};try{PROG=JSON.parse(localStorage.getItem('nucleo_prog')||'{}')}catch(e){}
function saveProg(){localStorage.setItem('nucleo_prog',JSON.stringify(PROG))}
function getLes(){const m=CUR.modules.find(m=>m.id===S.modId);return m?m.lessons.find(l=>l.id===S.lesId):null}
function getNext(){const m=CUR.modules.find(m=>m.id===S.modId);if(!m)return null;const i=m.lessons.findIndex(l=>l.id===S.lesId);return m.lessons[i+1]||null}

// ── VOICES ─────────────────────────────────────────────────────────────────
let voices=[];let voiceIdx=-1;
const SS=window.speechSynthesis;
function loadVoices(){
  if(!SS)return;
  const all=SS.getVoices();
  voices=all.filter(v=>v.lang.toLowerCase().startsWith('es'));
  if(!voices.length)voices=all;
  const saved=localStorage.getItem('nucleo_voice');
  if(saved){const i=voices.findIndex(v=>v.name===saved);if(i>=0)voiceIdx=i;}
  updateVoiceBtn();
}
function cycleVoice(){
  if(!voices.length)return;
  voiceIdx=(voiceIdx+1)%voices.length;
  localStorage.setItem('nucleo_voice',voices[voiceIdx].name);
  updateVoiceBtn();
  if(SS&&S.ttsOn&&S.ttsMode){
    const m=S.ttsMode,si=S.ttsSecIdx;SS.cancel();S.ttsOn=false;
    setTimeout(()=>{
      if(m==='full')_speak(ttsFullText,'full',null);
      else if(m==='sec'&&getLes()){const sec=getLes().sections[si];_speak(sec.t==='call'?sec.label+'. '+sec.v:sec.v,'sec',si);}
    },60);
  }
}
function updateVoiceBtn(){
  const btn=document.getElementById('tv');if(!btn)return;
  if(voiceIdx>=0&&voices[voiceIdx]){const n=voices[voiceIdx].name;btn.textContent=n.length>10?n.slice(0,10)+'…':n;}
  else btn.textContent='Voz';
}
if(SS){if(SS.getVoices().length>0)loadVoices();SS.onvoiceschanged=loadVoices;}

// ── TTS ────────────────────────────────────────────────────────────────────
let ttsFullText='';
function _speak(text,mode,secIdx){
  if(!SS)return;SS.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='es-ES';u.rate=S.ttsSpd;
  if(voiceIdx>=0&&voices[voiceIdx])u.voice=voices[voiceIdx];
  u.onend=u.onerror=()=>{S.ttsOn=false;S.ttsMode=null;S.ttsSecIdx=null;updateTTS();updateSecs()};
  SS.speak(u);S.ttsMode=mode;S.ttsSecIdx=secIdx;S.ttsOn=true;
  updateTTS();updateSecs();
}
function ttsToggle(){
  if(!SS)return;
  if(S.ttsMode==='full'){if(SS.paused){SS.resume();S.ttsOn=true;}else if(SS.speaking){SS.pause();S.ttsOn=false;}updateTTS();updateSecs();}
  else{_speak(ttsFullText,'full',null)}
}
function playSec(idx){
  if(!SS)return;
  if(S.ttsMode==='sec'&&S.ttsSecIdx===idx){
    if(SS.paused){SS.resume();S.ttsOn=true;}else if(SS.speaking){SS.pause();S.ttsOn=false;}
    updateTTS();updateSecs();return;
  }
  const les=getLes();if(!les)return;
  const sec=les.sections[idx];
  _speak(sec.t==='call'?sec.label+'. '+sec.v:sec.v,'sec',idx);
}
function ttsStop(){if(SS)SS.cancel();S.ttsOn=false;S.ttsMode=null;S.ttsSecIdx=null;updateTTS();updateSecs()}
function ttsCycle(){
  const a=[0.8,1.0,1.2,1.5];S.ttsSpd=a[(a.indexOf(S.ttsSpd)+1)%a.length];
  if(SS&&S.ttsOn&&S.ttsMode){
    const m=S.ttsMode,si=S.ttsSecIdx;SS.cancel();S.ttsOn=false;
    setTimeout(()=>{
      if(m==='full')_speak(ttsFullText,'full',null);
      else if(m==='sec'&&getLes()){const sec=getLes().sections[si];_speak(sec.t==='call'?sec.label+'. '+sec.v:sec.v,'sec',si);}
    },60);
  }
  updateTTS();
}
function updateTTS(){
  const pb=document.getElementById('tp');const lb=document.getElementById('tl');const sp=document.getElementById('ts');
  const fp=S.ttsMode==='full'&&S.ttsOn;
  if(pb)pb.textContent=fp?'⏸':'▶';
  if(lb)lb.textContent=fp?'Reproduciendo...':'Escuchar lección completa';
  if(sp)sp.textContent=S.ttsSpd+'×';
  updateVoiceBtn();
}
function updateSecs(){
  document.querySelectorAll('.sec-btn').forEach(btn=>{
    const idx=parseInt(btn.dataset.idx);
    const isP=S.ttsMode==='sec'&&S.ttsOn&&S.ttsSecIdx===idx;
    btn.classList.toggle('playing',isP);btn.textContent=isP?'⏸':'▶';
  });
}

// ── SYNTAX ─────────────────────────────────────────────────────────────────
function hl(code){
  const e=code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.split('\n').map(ln=>{
    const ci=ln.indexOf('//');
    if(ci>=0)return hlp(ln.slice(0,ci))+'<span class="cc">'+ln.slice(ci)+'</span>';
    return hlp(ln);
  }).join('\n');
}
function hlp(s){
  return s
    .replace(/"[^"]*"/g,m=>'<span class="cs">'+m+'</span>')
    .replace(/\b(public|private|protected|static|void|class|new|return|if|else|true|false|null|this|override|virtual|abstract|readonly|const|var|int|float|string|bool|double|get|set|interface|foreach|using|out|in|async|await|lock|volatile|while|for)\b/g,m=>'<span class="ck">'+m+'</span>')
    .replace(/\b(MonoBehaviour|Mathf|Debug|Quaternion|GameObject|Transform|Vector3|Enemy|Player|Skeleton|Zombie|Dragon|Turret|IDamageable|ILootable|IAttackable|List|Dictionary|HashSet|Stack|Queue|ItemData|Character|GameAction)\b/g,m=>'<span class="ct">'+m+'</span>')
    .replace(/\b(\d+\.?\d*f?)\b/g,m=>'<span class="cn">'+m+'</span>');
}

// ── NAV ────────────────────────────────────────────────────────────────────
const app=document.getElementById('app');
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));const v=document.getElementById('v-'+id);if(v){v.classList.remove('hidden');const sc=v.querySelector('.vscroll');if(sc)sc.scrollTop=0}}
function goHome(){ttsStop();renderHome();showView('home')}
function openLes(mid,lid){S.modId=mid;S.lesId=lid;ttsStop();renderLes();showView('les')}
function startEx(){S.exIdx=0;S.answers=[];S.answered=false;S.sel=null;renderEx();showView('ex')}
function backToLes(){ttsStop();renderLes();showView('les')}

// ── HOME ───────────────────────────────────────────────────────────────────
function renderHome(){
  let nextM=null,nextL=null;
  for(const m of CUR.modules){for(const l of m.lessons){if(!PROG[l.id]?.done){nextM=m;nextL=l;break}}if(nextL)break}
  let mods='';
  for(const m of CUR.modules){
    const done=m.lessons.filter(l=>PROG[l.id]?.done).length;
    const pct=(done/m.lessons.length)*100;
    let rows='';
    for(let i=0;i<m.lessons.length;i++){
      const l=m.lessons[i];
      const isDone=!!PROG[l.id]?.done;
      const isActive=!isDone&&(i===0||!!PROG[m.lessons[i-1]?.id]?.done);
      const dc=isDone?'done':isActive?'active':'';
      const di=isDone?'✓':isActive?'→':'';
      const lk=(!isDone&&!isActive)?' locked':'';
      const oc=lk?'':` onclick="openLes('${m.id}','${l.id}')"`;
      rows+=`<div class="les-row${lk}"${oc}><div class="les-dot ${dc}">${di}</div><div class="les-info"><div class="les-title">${l.title}</div><div class="les-sub">${l.sub}</div></div><div class="les-time">${l.min} min</div></div>`;
    }
    mods+=`<div class="mod-card"><div class="mod-head"><div class="mod-badge">${m.icon}</div><div><div class="mod-title">${m.title}</div><div class="mod-meta">${done}/${m.lessons.length} lecciones &mdash; ${m.desc}</div></div></div><div class="mod-progbar"><div class="mod-progfill" style="width:${pct}%"></div></div>${rows}</div>`;
  }
  const cb=nextL?`<button class="btn btn-primary btn-full" onclick="openLes('${nextM.id}','${nextL.id}')">Continuar &mdash; ${nextL.title}</button>`:`<button class="btn btn-ghost btn-full" disabled>Todo completado por ahora</button>`;
  app.innerHTML=`<div id="v-home" class="view"><div class="vscroll"><div class="home-hero"><div class="eyebrow">Núcleo CS &middot; Ingeniería de Bolsillo</div><h1 class="hero-title">Tu universidad<br>de bolsillo</h1><p class="hero-sub">Lecciones de 10&ndash;15 min para el transporte público.</p>${cb}</div><div style="padding:0 0 40px">${mods}</div></div></div><div id="v-les" class="view hidden"></div><div id="v-ex" class="view hidden"></div><div id="v-res" class="view hidden"></div>`;
}

// ── LESSON ─────────────────────────────────────────────────────────────────
function secBtn(i){return `<div class="sec-btn-row"><button class="sec-btn" data-idx="${i}" onclick="playSec(${i})">▶</button></div>`}
function renderLes(){
  const les=getLes();if(!les)return;
  ttsFullText=les.sections.filter(s=>['text','h2','call'].includes(s.t)).map(s=>s.v).join('. ');
  let html='';
  for(let i=0;i<les.sections.length;i++){
    const s=les.sections[i];
    if(s.t==='text') html+=`<div class="sec-wrap"><p class="lc-text">${s.v}</p>${secBtn(i)}</div>`;
    else if(s.t==='h2') html+=`<h2 class="lc-h2">${s.v}</h2>`;
    else if(s.t==='code') html+=`<pre class="lc-code">${hl(s.v)}</pre>`;
    else if(s.t==='call') html+=`<div class="lc-call"><div class="lc-call-label">${s.label}</div><div class="lc-call-text">${s.v}</div>${secBtn(i)}</div>`;
  }
  document.getElementById('v-les').innerHTML=`
    <div class="topbar">
      <button class="icon-btn" onclick="goHome()">&#8592;</button>
      <div class="topbar-title">${les.title}</div>
      <div class="topbar-meta">${les.min} min</div>
    </div>
    <div class="tts-strip">
      <button id="tp" class="icon-btn" onclick="ttsToggle()" style="width:36px;height:36px;font-size:.9rem">&#9654;</button>
      <span id="tl" class="tts-lbl">Escuchar lección completa</span>
      <button id="ts" class="tts-chip" onclick="ttsCycle()">1×</button>
      <button id="tv" class="tts-chip" onclick="cycleVoice()">Voz</button>
      <button class="icon-btn" onclick="ttsStop()" style="width:36px;height:36px;font-size:.85rem;color:var(--tx-d)">&#9632;</button>
    </div>
    <div class="vscroll"><div class="lcont">${html}</div><div class="gap"></div></div>
    <div class="botbar">
      <button class="btn btn-primary btn-full" onclick="startEx()">Ir a ejercicios &middot; ${les.exercises.length} preguntas</button>
    </div>`;
  updateVoiceBtn();
}

// ── EXERCISES ──────────────────────────────────────────────────────────────
function renderEx(){
  const les=getLes();if(!les)return;
  const exs=les.exercises;const cur=exs[S.exIdx];const pct=(S.exIdx/exs.length)*100;
  let body='';
  if(cur.type==='mc'){
    const opts=cur.opts.map((o,i)=>`<button class="opt" id="o${i}" onclick="selOpt(${i})"><span class="opt-lt">${'ABCD'[i]}</span><span>${o}</span></button>`).join('');
    body=`<div class="ex-tag">Opción múltiple</div><div class="ex-q">${cur.q}</div><div class="opt-list">${opts}</div>`;
  }else if(cur.type==='tf'){
    body=`<div class="ex-tag">Verdadero o falso</div><div class="ex-q">${cur.q}</div><div class="tf-row"><button class="tf" id="tft" onclick="selTF(true)">Verdadero</button><button class="tf" id="tff" onclick="selTF(false)">Falso</button></div>`;
  }else if(cur.type==='self'){
    body=`<div class="ex-tag">Autoevaluación</div><div class="ex-q">${cur.q}</div><div id="sb" class="self-box"><em style="color:var(--tx-d)">Pensá tu respuesta, luego presioná para revelar...</em></div><div id="sa" class="self-acts" style="display:none"><button class="btn btn-surf" style="flex:1" onclick="selfRes(false)">Necesito repasar</button><button class="btn btn-primary" style="flex:1" onclick="selfRes(true)">Lo entendí</button></div>`;
  }
  const foot=cur.type==='self'
    ?`<button class="btn btn-surf btn-full" id="rv" onclick="revSelf()">Revelar respuesta modelo</button>`
    :`<button class="btn btn-primary btn-full" id="sb2" onclick="submitEx()" disabled>Confirmar</button>`;
  document.getElementById('v-ex').innerHTML=`
    <div class="topbar">
      <button class="icon-btn" onclick="backToLes()">&#8592;</button>
      <div style="flex:1;height:4px;background:var(--brd);border-radius:2px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--amber);transition:width .3s"></div>
      </div>
      <div class="topbar-meta">${S.exIdx+1}/${exs.length}</div>
    </div>
    <div class="vscroll"><div class="ex-card">${body}<div id="fb" class="fb"></div></div><div class="gap"></div></div>
    <div class="botbar">${foot}</div>`;
}
function selOpt(i){if(S.answered)return;S.sel=i;document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i));const b=document.getElementById('sb2');if(b)b.disabled=false}
function selTF(v){if(S.answered)return;S.sel=v;const t=document.getElementById('tft');const f=document.getElementById('tff');if(t)t.classList.toggle('sel',v===true);if(f)f.classList.toggle('sel',v===false);const b=document.getElementById('sb2');if(b)b.disabled=false}
function submitEx(){
  if(S.answered||S.sel===null)return;S.answered=true;
  const les=getLes();const cur=les.exercises[S.exIdx];let ok=false;
  if(cur.type==='mc'){
    ok=S.sel===cur.correct;
    document.querySelectorAll('.opt').forEach((b,i)=>{b.classList.add('dis');if(i===cur.correct)b.classList.add('ok');else if(i===S.sel&&!ok)b.classList.add('err')});
  }else if(cur.type==='tf'){
    ok=S.sel===cur.correct;
    const t=document.getElementById('tft');const f=document.getElementById('tff');
    [t,f].forEach(b=>{if(b)b.classList.add('dis')});
    const wb=cur.correct===true?t:f;if(wb)wb.classList.add('ok');
    if(!ok){const lb=S.sel===true?t:f;if(lb)lb.classList.add('err')}
  }
  S.answers.push({ok});
  const fb=document.getElementById('fb');
  if(fb){fb.className=`fb ${ok?'':'err-fb'} show`;fb.innerHTML=`<div class="fb-lbl ${ok?'fb-ok':'fb-err'}">${ok?'✓ Correcto':'✗ Incorrecto'}</div><div class="fb-text">${cur.exp}</div>`}
  const btn=document.getElementById('sb2');
  if(btn){btn.textContent=S.exIdx<les.exercises.length-1?'Siguiente →':'Ver resultados';btn.disabled=false;btn.onclick=nextEx}
}
function revSelf(){
  const les=getLes();const cur=les.exercises[S.exIdx];
  const sb=document.getElementById('sb');const sa=document.getElementById('sa');const rv=document.getElementById('rv');
  if(sb){sb.classList.add('revealed');sb.textContent=cur.model}
  if(sa)sa.style.display='flex';if(rv)rv.style.display='none';
}
function selfRes(ok){S.answers.push({ok,self:true});nextEx()}
function nextEx(){
  const les=getLes();
  if(S.exIdx<les.exercises.length-1){S.exIdx++;S.answered=false;S.sel=null;renderEx();showView('ex')}
  else{
    const ok=S.answers.filter(a=>a.ok).length;
    PROG[S.lesId]={done:true,score:ok,total:S.answers.length,date:new Date().toISOString().slice(0,10)};
    saveProg();renderRes();showView('res');
  }
}

// ── RESULTS ────────────────────────────────────────────────────────────────
function renderRes(){
  const les=getLes();const ok=S.answers.filter(a=>a.ok).length;const total=S.answers.length;
  const pct=Math.round((ok/total)*100);const nxt=getNext();
  const msg=pct>=75?'Bien hecho':pct>=50?'Vas bien':'Seguí repasando';
  const rows=S.answers.map((a,i)=>{const ex=les.exercises[i];const q=ex.q.length>55?ex.q.slice(0,55)+'…':ex.q;return`<div class="res-row"><div class="res-ic" style="color:${a.ok?'var(--green)':'var(--red)'}">${a.ok?'✓':'✗'}</div><div class="res-q">${q}</div></div>`}).join('');
  document.getElementById('v-res').innerHTML=`
    <div class="topbar">
      <button class="icon-btn" onclick="goHome()">&#8592;</button>
      <div class="topbar-title">Lección completa</div>
    </div>
    <div class="vscroll">
      <div class="res-hero">
        <div style="font-size:2rem;margin-bottom:8px">${pct>=75?'★':pct>=50?'◎':'○'}</div>
        <div class="res-score">${ok}/${total}</div>
        <div class="res-lbl">${msg} &middot; ${pct}% correcto</div>
      </div>
      <div class="res-card">${rows}</div><div class="gap"></div>
    </div>
    <div class="botbar">
      <button class="btn btn-ghost" style="flex:1" onclick="startEx()">Repetir</button>
      ${nxt?`<button class="btn btn-primary" style="flex:2" onclick="openLes('${S.modId}','${nxt.id}')">Siguiente &#8594;</button>`:`<button class="btn btn-primary" style="flex:2" onclick="goHome()">Volver al inicio</button>`}
    </div>`;
}
renderHome();
</script>
</body>
</html>
