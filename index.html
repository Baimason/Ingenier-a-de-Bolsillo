<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Núcleo CS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1628;--surf:#142236;--raised:#1B2E47;--brd:#233652;--brd-dim:#1A2B40;
  --amber:#F5BA3A;--amber-bg:rgba(245,186,58,0.1);--amber-brd:rgba(245,186,58,0.22);
  --green:#48C98A;--green-bg:rgba(72,201,138,0.1);--red:#E55C5C;--red-bg:rgba(229,92,92,0.1);
  --tx:#C5D5E8;--tx-s:#7D96B5;--tx-d:#4A6580;
  --sans:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Fira Mono','Consolas',monospace;
  --r:8px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:var(--bg)}
body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{height:100%;max-width:480px;margin:0 auto;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden}
.view{display:flex;flex-direction:column;height:100%;overflow:hidden}
.view.hidden{display:none}
.vscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
h1{font-size:1.55rem;font-weight:700;line-height:1.2;color:var(--tx)}
h2{font-size:1.05rem;font-weight:600;line-height:1.3;color:var(--tx)}
p{font-size:0.93rem;line-height:1.85;color:var(--tx)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:calc(12px + var(--sat));background:var(--bg);
  border-bottom:1px solid var(--brd-dim);flex-shrink:0}
.topbar-title{flex:1;font-size:0.88rem;font-weight:600;color:var(--tx)}
.topbar-meta{font-size:0.75rem;color:var(--tx-s);flex-shrink:0}
.icon-btn{width:40px;height:40px;padding:0;border-radius:50%;background:transparent;
  color:var(--tx-s);font-size:1.1rem;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:var(--raised)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;
  border:none;border-radius:var(--r);font-family:var(--sans);font-size:0.88rem;font-weight:600;
  cursor:pointer;min-height:48px;-webkit-tap-highlight-color:transparent;transition:opacity .1s,transform .1s}
.btn:active:not(:disabled){opacity:.8;transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--amber);color:#0A1628}
.btn-ghost{background:transparent;color:var(--tx-s);border:1px solid var(--brd)}
.btn-surf{background:var(--raised);color:var(--tx);border:1px solid var(--brd)}
.btn-full{width:100%;display:flex}
.botbar{flex-shrink:0;padding:12px 16px;padding-bottom:calc(12px + var(--sab));
  background:var(--bg);border-top:1px solid var(--brd-dim);display:flex;gap:10px}
.home-hero{padding:calc(28px + var(--sat)) 16px 20px}
.eyebrow{font-size:0.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.hero-title{font-size:1.6rem;font-weight:700;line-height:1.15;margin-bottom:6px}
.hero-sub{font-size:0.84rem;color:var(--tx-s);margin-bottom:24px;line-height:1.65}
.mod-card{background:var(--surf);border-radius:10px;border:1px solid var(--brd-dim);margin:0 0 16px;overflow:hidden}
.mod-head{display:flex;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--brd-dim)}
.mod-badge{width:36px;height:36px;border-radius:8px;background:var(--amber-bg);display:flex;align-items:center;justify-content:center;color:var(--amber);font-size:1rem;flex-shrink:0;margin-top:2px}
.mod-title{font-size:0.93rem;font-weight:600;margin-bottom:3px;color:var(--tx)}
.mod-meta{font-size:0.75rem;color:var(--tx-s);line-height:1.5}
.mod-progbar{height:2px;background:var(--brd)}
.mod-progfill{height:100%;background:var(--amber);transition:width .4s}
.les-row{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .1s}
.les-row:active{background:var(--raised)}
.les-row.locked{opacity:.38;cursor:default;pointer-events:none}
.les-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;border:1.5px solid var(--brd);color:var(--tx-d)}
.les-dot.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.les-dot.active{border-color:var(--amber);color:var(--amber)}
.les-info{flex:1}
.les-title{font-size:.87rem;font-weight:500;color:var(--tx)}
.les-sub{font-size:.73rem;color:var(--tx-s);margin-top:1px}
.les-time{font-size:.72rem;color:var(--tx-d);flex-shrink:0}
.tts-strip{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surf);border-bottom:1px solid var(--brd-dim);flex-shrink:0}
.tts-lbl{font-size:.75rem;color:var(--tx-s);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tts-chip{font-size:.72rem;font-weight:700;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-brd);border-radius:4px;padding:4px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:var(--sans);white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis}
.lcont{padding:20px 16px 32px}
.lc-text{font-size:.93rem;line-height:1.85;color:var(--tx);margin-bottom:18px}
.lc-h2{font-size:1rem;font-weight:600;color:var(--tx);margin:28px 0 10px}
.lc-code{background:var(--raised);border-left:3px solid var(--amber);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.76rem;line-height:1.75;color:#A8C2DC;margin-bottom:18px;-webkit-overflow-scrolling:touch;white-space:pre}
.lc-call{background:var(--amber-bg);border-left:3px solid var(--amber);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin-bottom:18px}
.lc-call-label{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--amber);margin-bottom:6px}
.lc-call-text{font-size:.87rem;line-height:1.7;color:var(--tx)}
.sec-wrap{margin-bottom:18px}
.sec-wrap .lc-text{margin-bottom:6px}
.sec-btn-row{display:flex;justify-content:flex-end;padding-top:2px}
.sec-btn{width:28px;height:28px;border-radius:50%;background:transparent;border:1px solid var(--brd);color:var(--tx-d);font-size:.6rem;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;transition:border-color .12s,color .12s,background .12s;flex-shrink:0}
.sec-btn.playing{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.lc-call .sec-btn-row{margin-top:10px}
.ck{color:#C792EA}.cs{color:#9CCC65}.cn{color:#F78C6C}.cc{color:#4A6580;font-style:italic}.ct{color:#80DEEA}
.ex-card{background:var(--surf);border-radius:10px;border:1px solid var(--brd-dim);padding:20px;margin:16px}
.ex-tag{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tx-d);margin-bottom:14px}
.ex-q{font-size:.95rem;font-weight:500;line-height:1.6;color:var(--tx);margin-bottom:20px}
.opt-list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--raised);border:1.5px solid var(--brd);border-radius:var(--r);cursor:pointer;text-align:left;font-family:var(--sans);font-size:.87rem;line-height:1.5;color:var(--tx);-webkit-tap-highlight-color:transparent;width:100%;min-height:48px;transition:border-color .12s,background .12s}
.opt:not(.dis):active{background:var(--brd)}
.opt.sel{border-color:var(--amber);background:var(--amber-bg)}
.opt.ok{border-color:var(--green);background:var(--green-bg)}
.opt.err{border-color:var(--red);background:var(--red-bg)}
.opt.dis{cursor:default;pointer-events:none}
.opt-lt{width:22px;height:22px;border-radius:50%;background:var(--brd);display:flex;align-items:center;justify-content:center;font-size:.67rem;font-weight:700;flex-shrink:0;margin-top:1px}
.tf-row{display:flex;gap:10px}
.tf{flex:1;padding:16px;background:var(--raised);border:1.5px solid var(--brd);border-radius:var(--r);cursor:pointer;font-family:var(--sans);font-size:.93rem;font-weight:600;color:var(--tx);min-height:56px;-webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s,color .12s}
.tf.sel{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.tf.ok{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.tf.err{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.tf.dis{cursor:default;pointer-events:none}
.self-box{padding:14px;background:var(--raised);border:1.5px dashed var(--brd);border-radius:var(--r);margin-bottom:14px;font-size:.87rem;line-height:1.7;color:var(--tx-s)}
.self-box.revealed{border-style:solid;border-color:var(--amber);background:var(--amber-bg);color:var(--tx)}
.self-acts{display:flex;gap:10px}
.fb{background:var(--raised);border-radius:var(--r);padding:14px;margin-top:16px;border-left:3px solid var(--green);display:none}
.fb.err-fb{border-left-color:var(--red)}
.fb.show{display:block}
.fb-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.fb-ok{color:var(--green)}.fb-err{color:var(--red)}
.fb-text{font-size:.84rem;line-height:1.6;color:var(--tx-s)}
.res-hero{text-align:center;padding:36px 20px 28px}
.res-score{font-size:3.5rem;font-weight:700;color:var(--amber);line-height:1}
.res-lbl{font-size:.85rem;color:var(--tx-s);margin-top:4px}
.res-card{background:var(--surf);border-radius:10px;border:1px solid var(--brd-dim);margin:0 16px 16px;overflow:hidden}
.res-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--brd-dim);font-size:.87rem}
.res-row:last-child{border-bottom:none}
.res-ic{font-size:.9rem;width:20px;text-align:center;flex-shrink:0}
.res-q{flex:1;color:var(--tx-s)}
.gap{height:32px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CUR={modules:[
{
  id:"oop",title:"Programación Orientada a Objetos",
  desc:"Los cuatro pilares formales del código que ya escribís",icon:"◈",
  lessons:[
  {id:"oop-01",title:"¿Qué es un objeto?",sub:"Clases, instancias y blueprints",min:12,
   sections:[
    {t:"text",v:"Ya usás objetos. Cada vez que creás un script de C# en Unity, estás usando Programación Orientada a Objetos sin haberle puesto nombre formal. Eso cambia ahora."},
    {t:"h2",v:"La clase: el blueprint"},
    {t:"text",v:"Una clase es un blueprint, una plantilla. Define qué propiedades y comportamientos va a tener algo, pero por sí sola no es nada concreto. Es como los planos de una casa: describen la casa en detalle, pero no son la casa."},
    {t:"code",v:"public class Enemy : MonoBehaviour\n{\n    public string enemyName;\n    public int health;\n    public float speed;\n\n    public void TakeDamage(int amount)\n    {\n        health -= amount;\n    }\n}"},
    {t:"text",v:"Eso es una clase. Describe cómo es un enemigo: tiene nombre, vida, velocidad y puede recibir daño. Pero en ese código no existe ningún enemigo real todavía. Es solo la plantilla."},
    {t:"h2",v:"El objeto: la instancia"},
    {t:"text",v:"Un objeto es una instancia de una clase. Es cuando usás ese blueprint para crear algo concreto en memoria. En Unity, cuando arrastrás un prefab al escenario, se crea un objeto usando la clase como plantilla. Si tenés 20 enemigos en pantalla, tenés 20 objetos distintos basados en la misma clase."},
    {t:"call",label:"Analogía",v:"La clase Enemy es el molde para hacer galletas. Cada galleta que hacés con ese molde es un objeto. Todas tienen la misma forma (mismas propiedades), pero son entidades independientes: si mordés una, las demás no se afectan."},
    {t:"code",v:"Enemy goblin = new Enemy();\ngoblin.enemyName = \"Goblin\";\ngoblin.health = 50;\n\nEnemy troll = new Enemy();\ntroll.enemyName = \"Troll\";\ntroll.health = 200;\n\ngoblin.TakeDamage(10);\n// goblin.health = 40; troll.health sigue siendo 200"},
    {t:"h2",v:"¿Por qué existe OOP?"},
    {t:"text",v:"Antes de OOP, manejar múltiples entidades era un caos: con 50 tipos de enemigos, necesitabas 50 grupos de variables sueltas sin relación entre sí. OOP agrupa los datos y el comportamiento relacionado en un solo lugar. El código se vuelve organizado, reutilizable y mantenible."},
    {t:"call",label:"En una entrevista",v:"\"Un objeto es una instancia de una clase. La clase define la estructura (propiedades) y el comportamiento (métodos); el objeto es una entidad concreta en memoria con sus propios datos. OOP existe para organizar el código agrupando datos y comportamiento relacionado, haciéndolo más reutilizable y mantenible.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Cuál describe mejor la diferencia entre clase y objeto?",opts:["Una clase es un objeto especial con más funciones.","La clase es el blueprint; el objeto es una instancia creada a partir de ese blueprint.","Un objeto y una clase son lo mismo, solo cambia el contexto.","Los objetos solo existen en lenguajes como Java."],correct:1,exp:"La clase define estructura y comportamiento. El objeto es una entidad concreta creada a partir de esa clase. Podés tener muchos objetos de la misma clase, cada uno con sus propios datos independientes."},
    {id:"e2",type:"tf",q:"Si tengo dos instancias de Enemy y le bajo la vida a una, la otra también se ve afectada.",correct:false,exp:"Falso. Cada objeto tiene su propia copia de los datos. Son entidades independientes en memoria. Modificar uno no afecta a los demás."},
    {id:"e3",type:"mc",q:"En Unity, cuando arrastrás un prefab al escenario, ¿qué estás creando?",opts:["Una nueva clase.","Una instancia (objeto) de la clase del script del prefab.","Una variable global compartida.","Un método nuevo."],correct:1,exp:"Al instanciar un prefab, Unity crea un nuevo objeto en memoria usando la clase del script como plantilla. Es exactamente el concepto de clase vs instancia aplicado a tu flujo de trabajo diario."},
    {id:"e4",type:"self",q:"Explicá con tus propias palabras: ¿qué es OOP y por qué existe?",model:"OOP es un paradigma de programación que organiza el código en objetos: entidades que agrupan datos relacionados (propiedades) y comportamiento (métodos). Existe porque antes era muy difícil manejar sistemas complejos con variables sueltas sin relación entre sí. OOP hace el código más organizado, reutilizable y mantenible."}
   ]},
  {id:"oop-02",title:"Encapsulamiento",sub:"El guardián de tus datos",min:11,
   sections:[
    {t:"text",v:"Encapsulamiento es el principio de ocultar los detalles internos de un objeto y exponer solo lo necesario. Pensalo como la interfaz de tu teléfono: no necesitás saber cómo funciona el procesador para usarlo."},
    {t:"h2",v:"El problema sin encapsulamiento"},
    {t:"text",v:"Imaginá que el campo health de tu enemigo es público. Cualquier script del proyecto puede hacer esto sin ningún control:"},
    {t:"code",v:"enemy.health = -999;  // ¿Vida negativa?\nenemy.health = 99999; // Invencible de repente\n// Si hay un bug, tenés que revisar TODOS los scripts"},
    {t:"h2",v:"La solución: private + método público"},
    {t:"code",v:"public class Enemy : MonoBehaviour\n{\n    private int health = 100;\n\n    public void TakeDamage(int amount)\n    {\n        if (amount <= 0) return;\n        health = Mathf.Max(0, health - amount);\n        if (health == 0) Die();\n    }\n\n    public int Health => health; // Solo lectura\n}"},
    {t:"call",label:"El patrón",v:"Private field + public method (o property). El dato está protegido, la lógica vive en el método. Quien llama TakeDamage() no necesita saber cómo funciona adentro."},
    {t:"h2",v:"Properties en C#"},
    {t:"code",v:"public class Player : MonoBehaviour\n{\n    private int _coins = 0;\n\n    public int Coins\n    {\n        get => _coins;\n        private set => _coins = Mathf.Max(0, value);\n    }\n\n    public void AddCoins(int amount) { Coins += amount; }\n\n    public bool SpendCoins(int amount)\n    {\n        if (Coins < amount) return false;\n        Coins -= amount;\n        return true;\n    }\n}"},
    {t:"call",label:"En una entrevista",v:"\"Encapsulamiento es ocultar los detalles de implementación de un objeto y exponer solo una interfaz pública controlada. Protege la integridad de los datos al hacer que solo el objeto mismo pueda modificarlos directamente, reduciendo el acoplamiento entre componentes y centralizando la lógica de validación.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Cuál es el objetivo principal del encapsulamiento?",opts:["Hacer el código más corto.","Controlar cómo se accede y modifica el estado interno de un objeto.","Evitar usar variables.","Compartir métodos entre múltiples clases."],correct:1,exp:"Encapsulamiento trata de control: quién puede leer y modificar los datos de un objeto, y bajo qué condiciones. Reduce bugs, facilita el debugging y hace el código más mantenible."},
    {id:"e2",type:"tf",q:"Un campo marcado como private en C# puede ser leído directamente desde otro script.",correct:false,exp:"Falso. Un campo private solo es accesible desde dentro de la misma clase. Para exponerlo externamente se usa un getter público, una property, o se cambia el modificador de acceso."},
    {id:"e3",type:"mc",q:"¿Qué ventaja concreta da TakeDamage(int amount) sobre un campo health público?",opts:["Ninguna, es pura preferencia de estilo.","El método es más rápido de ejecutar.","Centraliza la lógica: validás, garantizás rangos válidos, triggeás la muerte, todo en un lugar.","Evita warnings del compilador."],correct:2,exp:"Con TakeDamage() toda la lógica relacionada al daño está en un solo lugar. Si algo falla, sabés exactamente dónde buscar. Con un campo público, esa lógica queda dispersa en todos los scripts del proyecto."},
    {id:"e4",type:"self",q:"Explicá encapsulamiento con un ejemplo de Unity distinto al de la vida del enemigo.",model:"Ejemplo con monedas: el campo _coins es private para que nadie lo asigne a un valor negativo directamente. Se expone a través de SpendCoins() y AddCoins() que validan la operación. Otro ejemplo: la velocidad del personaje como private float _speed con SetSpeed(float v) que la limita entre 0 y maxSpeed. El principio es siempre el mismo: el objeto controla cómo cambian sus propios datos."}
   ]},
  {id:"oop-03",title:"Herencia",sub:"Construir sobre lo que ya existe",min:13,
   sections:[
    {t:"text",v:"Herencia permite que una clase tome como base otra clase existente, heredando todas sus propiedades y comportamientos. En Unity lo usás constantemente: cada script que escribís hereda de MonoBehaviour."},
    {t:"h2",v:"La cadena que ya conocés"},
    {t:"text",v:"Cuando escribís public class PlayerController : MonoBehaviour, tu script hereda Start(), Update(), GetComponent() y todo lo demás sin que tengas que escribirlo. Unity usa herencia en toda su jerarquía interna: Object -> Component -> Behaviour -> MonoBehaviour -> tu script."},
    {t:"h2",v:"Tu propia jerarquía"},
    {t:"code",v:"public class Enemy : MonoBehaviour\n{\n    public string enemyName;\n    protected int health = 100;  // protected: visible en clases derivadas\n\n    public virtual void Attack()  // virtual: puede ser reemplazado\n    {\n        Debug.Log(enemyName + \" ataca\");\n    }\n\n    public void TakeDamage(int amount)\n    {\n        health = Mathf.Max(0, health - amount);\n        if (health == 0) Die();\n    }\n\n    protected virtual void Die() { Destroy(gameObject); }\n}"},
    {t:"code",v:"public class Skeleton : Enemy\n{\n    public override void Attack()  // override: reemplaza el virtual del padre\n    {\n        Debug.Log(\"Skeleton dispara flecha\");\n    }\n}\n\npublic class Zombie : Enemy\n{\n    public override void Attack()\n    {\n        Debug.Log(\"Zombie muerde y contagia veneno\");\n    }\n\n    protected override void Die()\n    {\n        base.Die();         // Llama al Die() del padre\n        SpawnMiniZombie(); // Y además hace esto\n    }\n}"},
    {t:"call",label:"base.Method()",v:"base.Die() ejecuta el método Die() de la clase padre antes que el tuyo. No copiás la lógica del padre: la reutilizás y agregás lo que necesitás encima. Es la forma de extender sin duplicar."},
    {t:"h2",v:"private vs protected"},
    {t:"text",v:"Private: solo accesible dentro de la misma clase, ni la clase derivada lo ve. Protected: accesible dentro de la clase y en cualquier clase que herede de ella. En Enemy usamos protected int health para que Skeleton y Zombie puedan leerlo sin exponerlo al mundo entero."},
    {t:"h2",v:"Cuándo NO usar herencia"},
    {t:"text",v:"Herencia modela 'es-un': Skeleton ES UN Enemy. Si la relación es 'tiene-un', la herramienta correcta es composición. Un Player TIENE UNA Weapon, no ES UNA Weapon. El error más común es abusar de la herencia donde debería ir composición."},
    {t:"call",label:"En una entrevista",v:"\"Herencia permite que una clase derive de otra, heredando sus propiedades y comportamientos. Modela relaciones 'es-un' y favorece la reutilización de código. En C# la clase derivada usa ':' para heredar y 'override' para reemplazar comportamientos. El exceso de herencia genera jerarquías rígidas; la alternativa para relaciones 'tiene-un' es la composición.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué significa public class Skeleton : Enemy en C#?",opts:["Skeleton contiene un objeto de tipo Enemy.","Skeleton hereda de Enemy: tiene todas sus propiedades y métodos accesibles.","Skeleton y Enemy son la misma clase con diferente nombre.","Enemy hereda de Skeleton."],correct:1,exp:"El ':' en C# indica herencia. Skeleton es una clase derivada de Enemy. Hereda todos los miembros accesibles (public y protected) y puede extenderlos o reemplazarlos."},
    {id:"e2",type:"tf",q:"Una clase derivada puede acceder directamente a los campos private de su clase base.",correct:false,exp:"Falso. Los campos private solo son accesibles dentro de la misma clase que los declara. Para que la clase derivada los vea, deben ser protected o public."},
    {id:"e3",type:"mc",q:"¿Para qué sirve base.Die() dentro de un método override?",opts:["Para crear una nueva instancia de la clase padre.","Para llamar al método Die() de la clase padre, reutilizando su lógica.","Para bloquear que otras clases hereden de esta.","Para hacer que Die() sea abstracto."],correct:1,exp:"base.Method() llama a la implementación de la clase padre. Útil cuando querés ejecutar la lógica original del padre además de la tuya propia, sin copiarla."},
    {id:"e4",type:"self",q:"¿Cuándo deberías usar herencia y cuándo composición? Pensá un ejemplo de cada caso.",model:"Herencia cuando la relación es 'es-un': Skeleton es un Enemy. Composición cuando la relación es 'tiene-un': un Player tiene una Weapon. En Unity es muy común la composición: el Player tiene referencia a su Inventory, su MovementController, su CombatSystem como componentes separados. La regla: si no podés decir 'X es un Y' con naturalidad, probablemente debés componer en lugar de heredar."}
   ]},
  {id:"oop-04",title:"Polimorfismo",sub:"La misma llamada, diferentes comportamientos",min:12,
   sections:[
    {t:"text",v:"Polimorfismo significa muchas formas. Es la capacidad de tratar objetos de diferentes clases de manera uniforme, donde cada uno responde a la misma llamada de método con su propio comportamiento. Es el resultado natural de combinar herencia con override."},
    {t:"h2",v:"El problema sin polimorfismo"},
    {t:"code",v:"// Sin polimorfismo: hay que tocar esto con cada nuevo enemigo\nforeach (var enemy in enemies)\n{\n    if (enemy is Skeleton) ((Skeleton)enemy).ShootArrow();\n    else if (enemy is Zombie) ((Zombie)enemy).Bite();\n    else if (enemy is Dragon) ((Dragon)enemy).BreatheFire();\n}"},
    {t:"code",v:"// Con polimorfismo: limpio y extensible para siempre\nforeach (Enemy enemy in enemies)\n{\n    enemy.Attack(); // Cada uno responde a su manera\n}\n// Un nuevo tipo de enemigo: solo crear la clase.\n// Este loop NUNCA cambia."},
    {t:"h2",v:"virtual y override"},
    {t:"code",v:"public class Enemy : MonoBehaviour\n{\n    public virtual void Attack()  // Puede ser reemplazado\n    {\n        Debug.Log(\"Ataque genérico\");\n    }\n}\n\npublic class Skeleton : Enemy\n{\n    public override void Attack() { Debug.Log(\"Skeleton dispara\"); }\n}\n\npublic class Dragon : Enemy\n{\n    public override void Attack() { Debug.Log(\"Dragon lanza fuego\"); }\n}"},
    {t:"call",label:"El concepto clave",v:"La variable es de tipo Enemy pero el objeto en memoria es de tipo Skeleton. Cuando llamás Attack(), C# mira el tipo real del objeto (Skeleton), no el tipo declarado de la variable (Enemy). Eso es el dispatch dinámico, el mecanismo interno del polimorfismo."},
    {t:"h2",v:"Polimorfismo vía interfaces"},
    {t:"code",v:"public interface IAttackable { void Attack(); }\n\npublic class Turret : MonoBehaviour, IAttackable\n{\n    public void Attack() { Debug.Log(\"Turret dispara\"); }\n}\n\npublic class Dragon : MonoBehaviour, IAttackable\n{\n    public void Attack() { Debug.Log(\"Dragon lanza fuego\"); }\n}\n\n// Turret y Dragon no comparten clase base, pero se tratan igual:\nIAttackable[] attackers = { turret, dragon };\nforeach (var a in attackers) a.Attack();"},
    {t:"call",label:"En una entrevista",v:"\"Polimorfismo es la capacidad de tratar objetos de distintos tipos de manera uniforme. En C# se logra con métodos virtual/override (polimorfismo de subtipo) o con interfaces. Permite escribir código que opera sobre una abstracción sin conocer el tipo concreto del objeto, haciéndolo extensible sin modificación.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué debe tener un método en la clase base para que pueda ser reemplazado con override?",opts:["El modificador static.","El modificador virtual.","El modificador abstract.","No necesita nada especial."],correct:1,exp:"Un método virtual puede ser reemplazado (override) en clases derivadas. Sin virtual, la clase derivada oculta el método en lugar de reemplazarlo y el polimorfismo no funciona correctamente."},
    {id:"e2",type:"tf",q:"Con polimorfismo, si una variable de tipo Enemy apunta a un Skeleton, llamar Attack() ejecuta la versión de Enemy, no la de Skeleton.",correct:false,exp:"Falso. El polimorfismo usa dispatch dinámico: se ejecuta la versión del tipo real del objeto en memoria (Skeleton), no el tipo declarado de la variable (Enemy). Para eso sirve exactamente el mecanismo virtual/override."},
    {id:"e3",type:"mc",q:"¿Qué ventaja da iterar sobre List<Enemy> y llamar Attack() sobre un bloque if/else por tipo?",opts:["Es más rápido de ejecutar.","No necesita override.","Agregar nuevos tipos de Enemy no requiere modificar el código que los itera.","No hay diferencia real."],correct:2,exp:"El beneficio central del polimorfismo es la extensibilidad: agregar un Dragon o Vampire solo requiere crear la clase con su Attack(). El loop que itera los enemigos nunca cambia. El código está abierto a extensión pero cerrado a modificación."},
    {id:"e4",type:"self",q:"Explicá con tus propias palabras qué es el polimorfismo y por qué es útil en un juego con múltiples tipos de enemigos.",model:"Polimorfismo permite tratar objetos de distintos tipos como si fueran del mismo tipo base, y cada uno responde a la misma llamada con su comportamiento específico. En un juego, significa que podés tener una lista de Enemy y llamar Attack() en todos: el Skeleton dispara, el Zombie muerde, el Dragon lanza fuego. El código que maneja los enemigos no necesita cambiar cuando agregás tipos nuevos."}
   ]},
  {id:"oop-05",title:"Abstracción",sub:"La interfaz es lo que importa, no los detalles",min:11,
   sections:[
    {t:"text",v:"Abstracción es el principio de exponer solo lo que es necesario para usar algo, ocultando cómo funciona por dentro. Cuando llamás Rigidbody.AddForce() no sabés cómo Unity calcula la física internamente, solo sabés que funciona. Eso es abstracción."},
    {t:"h2",v:"Clases abstractas"},
    {t:"code",v:"// abstract: no podés hacer new Enemy() directamente\npublic abstract class Enemy : MonoBehaviour\n{\n    protected int health = 100;\n\n    // Las subclases DEBEN implementar esto\n    public abstract void Attack();\n    public abstract int GetExpReward();\n\n    // Concreto: compartido por todos\n    public void TakeDamage(int amount)\n    {\n        health = Mathf.Max(0, health - amount);\n        if (health == 0) Die();\n    }\n\n    protected virtual void Die() { Destroy(gameObject); }\n}"},
    {t:"text",v:"Ahora es imposible hacer new Enemy() en ningún script. Cada clase derivada está obligada a implementar Attack() y GetExpReward() o el compilador lanza error. Esta es una garantía en tiempo de compilación, no en tiempo de ejecución."},
    {t:"h2",v:"Interfaces"},
    {t:"code",v:"public interface IDamageable\n{\n    int Health { get; }\n    void TakeDamage(int amount);\n}\n\npublic interface ILootable\n{\n    void DropLoot();\n}\n\n// Skeleton implementa ambas interfaces y hereda Enemy\npublic class Skeleton : Enemy, IDamageable, ILootable\n{\n    public override void Attack() { ... }\n    public override int GetExpReward() => 50;\n    public void DropLoot() { Instantiate(bonePrefab, transform.position, Quaternion.identity); }\n}"},
    {t:"call",label:"Clase abstracta vs interfaz",v:"Clase abstracta: cuando las subclases comparten lógica real (TakeDamage igual para todos los Enemy). Interfaz: cuando querés definir una capacidad que pueden tener tipos no relacionados (un Barrel también puede ser IDamageable aunque no sea Enemy)."},
    {t:"h2",v:"Los cuatro pilares en un ejemplo"},
    {t:"code",v:"public abstract class Enemy : MonoBehaviour\n{\n    protected int health;           // Encapsulamiento\n    public abstract void Attack();  // Abstracción\n\n    public void TakeDamage(int dmg) // Encapsulamiento\n    {\n        health = Mathf.Max(0, health - dmg);\n    }\n}\n\npublic class Skeleton : Enemy      // Herencia\n{\n    public override void Attack()  // Polimorfismo\n    {\n        Debug.Log(\"Skeleton dispara\");\n    }\n}"},
    {t:"call",label:"En una entrevista",v:"\"Abstracción es el principio de exponer solo la interfaz necesaria para usar algo, ocultando los detalles de implementación. En C# se logra con clases abstractas (estructura común y métodos obligatorios) e interfaces (contratos puros que múltiples tipos pueden implementar). El objetivo es reducir la complejidad que el código cliente necesita manejar.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué diferencia a una clase abstracta de una clase normal?",opts:["Una clase abstracta corre más rápido.","No puede ser instanciada directamente y puede tener métodos abstract que las subclases deben implementar.","No puede tener métodos concretos, solo abstractos.","Es lo mismo que una interfaz."],correct:1,exp:"Una clase abstracta no puede instanciarse. Puede contener métodos concretos (con implementación compartida) y métodos abstract que obligan a las subclases a implementarlos."},
    {id:"e2",type:"tf",q:"En C#, una clase puede implementar múltiples interfaces al mismo tiempo.",correct:true,exp:"Verdadero. C# no permite herencia múltiple de clases (solo podés heredar de una), pero podés implementar cualquier cantidad de interfaces. Por eso las interfaces son ideales para capacidades ortogonales como IDamageable, ILootable, ISaveable."},
    {id:"e3",type:"mc",q:"¿Cuándo conviene usar una interfaz en lugar de una clase abstracta?",opts:["Siempre, las interfaces son mejores en todos los casos.","Cuando querés un contrato que tipos no relacionados puedan implementar (Barrel e Enemy pueden ser IDamageable sin compartir clase base).","Cuando las clases derivadas comparten mucha lógica en común.","Cuando solo una clase va a implementar el contrato."],correct:1,exp:"Las interfaces son ideales cuando tipos no relacionados necesitan la misma capacidad. La clase abstracta es mejor cuando hay lógica real compartida entre las clases derivadas."},
    {id:"e4",type:"self",q:"Describí los cuatro pilares de OOP en una sola oración cada uno, sin leer las lecciones.",model:"Encapsulamiento: ocultar los datos internos y controlar el acceso a través de métodos o properties. Herencia: una clase deriva de otra, reutilizando y extendiendo su comportamiento. Polimorfismo: la misma llamada de método produce comportamientos diferentes según el tipo real del objeto. Abstracción: exponer solo lo necesario para usar algo, ocultando los detalles de implementación detrás de una interfaz clara."}
   ]}
  ]
},
{
  id:"ds",title:"Estructuras de Datos",
  desc:"Arrays, diccionarios, stacks y el costo real del código",icon:"⬡",
  lessons:[
  {id:"ds-01",title:"Arrays y List<T>",sub:"Las colecciones más usadas",min:12,
   sections:[
    {t:"text",v:"En casi cualquier sistema de juego necesitás guardar múltiples valores del mismo tipo: los puntos de spawn del nivel, los enemigos activos, el inventario del jugador. Para eso existen las colecciones. Las dos más comunes en C# son los arrays y las listas."},
    {t:"h2",v:"Arrays: tamaño fijo, acceso instantáneo"},
    {t:"text",v:"Un array tiene tamaño fijo: una vez que lo creás, no podés agregar ni quitar elementos. Lo que ganás a cambio es acceso por índice en O(1), es decir, buscar el elemento en la posición 0 o en la posición 999 tarda exactamente lo mismo."},
    {t:"code",v:"// Array de tamaño fijo\nTransform[] spawnPoints = new Transform[5];\nspawnPoints[0] = point1;\nspawnPoints[1] = point2;\n\n// O con inicialización directa\nstring[] weaponNames = { \"Sword\", \"Bow\", \"Staff\" };\n\n// Acceso por índice: O(1)\nstring first = weaponNames[0];\nint count = weaponNames.Length;"},
    {t:"h2",v:"List<T>: cuando el tamaño cambia"},
    {t:"text",v:"Una lista es un array dinámico. Internamente es un array que se duplica cuando se llena. Podés agregar y quitar elementos libremente. Agregar al final es O(1) la mayoría del tiempo (amortizado), pero buscar o eliminar por valor es O(n) porque hay que recorrer toda la lista."},
    {t:"code",v:"List<Enemy> activeEnemies = new List<Enemy>();\n\nactiveEnemies.Add(newEnemy);            // O(1) amortizado\nbool exists = activeEnemies.Contains(e); // O(n) — recorre toda la lista\nactiveEnemies.Remove(deadEnemy);         // O(n) — busca y desplaza\nEnemy first = activeEnemies[0];          // O(1) — acceso por índice\n\nforeach (Enemy e in activeEnemies)\n    e.UpdateAI();                         // O(n)"},
    {t:"call",label:"Analogía",v:"El array es una fila de casilleros numerados: sabés exactamente cuántos hay y cuál es cuál. La lista es esa misma fila pero dinámica: cuando se llena, se crea una fila el doble de grande y los datos se mueven solos."},
    {t:"h2",v:"¿Cuándo usar cada uno?"},
    {t:"text",v:"Array cuando el tamaño es fijo y lo sabés en tiempo de diseño: waypoints de una patrulla, slots de una barra de habilidades, posibles colores de un personaje. List<T> cuando el tamaño cambia en runtime: enemigos activos, items en el inventario, proyectiles en vuelo. En Unity verás List<T> mucho más seguido porque los juegos son dinámicos."},
    {t:"call",label:"En una entrevista",v:"\"Un array tiene tamaño fijo y acceso O(1) por índice. Una List<T> es un array dinámico con O(1) amortizado para agregar al final, pero O(n) para buscar o eliminar por valor. Elegís array cuando el tamaño es conocido y fijo; List<T> cuando la colección necesita crecer y decrecer en runtime.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué estructura usarías para guardar los enemigos activos que aparecen y mueren durante el juego?",opts:["Un array fijo de Enemy[]","List<Enemy>","Un solo Enemy","string[]"],correct:1,exp:"List<Enemy> porque la cantidad de enemigos activos cambia constantemente en runtime: nacen con Add() y mueren con Remove(). Un array fijo no permite agregar ni quitar elementos."},
    {id:"e2",type:"tf",q:"List<T>.Contains() tiene complejidad O(1), igual que el acceso por índice.",correct:false,exp:"Falso. Contains() es O(n): tiene que comparar cada elemento uno por uno hasta encontrar el que busca o llegar al final. El acceso por índice (list[i]) sí es O(1)."},
    {id:"e3",type:"mc",q:"¿Cuál es la complejidad de acceder a un elemento de un array por su índice?",opts:["O(n) — depende del tamaño del array","O(log n) — busca en forma de árbol","O(1) — acceso directo a la posición en memoria","O(n²) — compara todos los pares"],correct:2,exp:"O(1) — la dirección de memoria de cualquier elemento se calcula directamente con la fórmula: base + índice * tamaño_del_elemento. No importa si el array tiene 10 o 10 millones de elementos."},
    {id:"e4",type:"self",q:"Describí cuándo usarías un array fijo vs una List<T> en el contexto de un juego de Unity.",model:"Array fijo para colecciones que no cambian de tamaño en runtime: los waypoints de una patrulla tienen una cantidad fija definida en el editor, los slots de la hotbar tienen siempre el mismo número. List<T> para colecciones que crecen y decrecen: la lista de enemigos activos, los items del inventario, los proyectiles en vuelo. En la práctica, List<T> aparece mucho más en Unity porque los estados del juego son dinámicos."}
   ]},
  {id:"ds-02",title:"Dictionary y HashSet",sub:"Acceso instantáneo por clave",min:11,
   sections:[
    {t:"text",v:"Un diccionario guarda pares clave-valor y permite encontrar cualquier valor en O(1) si conocés su clave. Es la diferencia entre buscar un nombre leyendo 1000 registros uno por uno, o buscar directamente en una agenda por inicial."},
    {t:"h2",v:"Cómo funciona internamente"},
    {t:"text",v:"Un diccionario usa una tabla hash: convierte la clave en un número (su hash) y lo usa para encontrar directamente la posición del valor en memoria. Por eso el lookup es O(1) sin importar cuántos elementos tiene el diccionario."},
    {t:"code",v:"Dictionary<string, ItemData> itemDB = new Dictionary<string, ItemData>();\n\n// Agregar: O(1)\nitemDB[\"iron_sword\"] = new ItemData(\"Iron Sword\", 10, 50);\nitemDB[\"health_potion\"] = new ItemData(\"Health Potion\", 0, 20);\n\n// Buscar: O(1)\nItemData item = itemDB[\"iron_sword\"];\n\n// Forma segura (no lanza excepción si no existe)\nif (itemDB.TryGetValue(\"iron_sword\", out ItemData result))\n    Debug.Log(result.name);\n\n// Eliminar: O(1)\nitemDB.Remove(\"health_potion\");\n\n// Iterar: O(n)\nforeach (var pair in itemDB)\n    Debug.Log(pair.Key + \": \" + pair.Value.name);"},
    {t:"call",label:"Siempre usá TryGetValue",v:"Acceder con itemDB[\"key\"] lanza una KeyNotFoundException si la clave no existe. Siempre que no estés 100% seguro de que la clave está, usá TryGetValue. En juegos, donde el estado cambia constantemente, es la opción segura."},
    {t:"h2",v:"Casos de uso en Unity"},
    {t:"code",v:"// Buffs activos: tipo de buff -> tiempo restante\nDictionary<BuffType, float> activeBuffs = new Dictionary<BuffType, float>();\n\n// Base de datos de audio: nombre -> AudioClip\nDictionary<string, AudioClip> audioLibrary = new Dictionary<string, AudioClip>();\n\n// Progreso de logros: id -> completado\nDictionary<string, bool> achievementProgress = new Dictionary<string, bool>();\n\n// Lookup de enemies por ID (evita buscar con Find)\nDictionary<int, Enemy> enemyById = new Dictionary<int, Enemy>();"},
    {t:"h2",v:"HashSet<T>: el diccionario sin valor"},
    {t:"text",v:"Un HashSet es como un diccionario donde solo importan las claves, sin valor asociado. Garantiza que no hay duplicados y Contains es O(1). Perfecto para trackear 'ya visité este nodo' en pathfinding, o 'el jugador ya desbloqueó este item'."},
    {t:"code",v:"HashSet<string> unlockedItems = new HashSet<string>();\nunlockedItems.Add(\"iron_sword\");\nunlockedItems.Add(\"iron_sword\"); // No hace nada, ya existe\n\nbool hasItem = unlockedItems.Contains(\"iron_sword\"); // O(1), true\nint count = unlockedItems.Count;"},
    {t:"call",label:"En una entrevista",v:"\"Un Dictionary<K,V> guarda pares clave-valor con lookup, inserción y eliminación en O(1) promedio, usando hashing internamente. Es la herramienta correcta cuando necesitás acceder a datos por un identificador único. HashSet<T> es la versión sin valor, útil para verificar existencia en O(1) o garantizar elementos únicos.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Por qué el lookup en un Dictionary<K,V> es O(1)?",opts:["Porque los datos están ordenados y usa búsqueda binaria.","Porque usa una tabla hash que calcula directamente la posición del valor a partir de la clave.","Porque recorre todos los elementos muy rápido.","Porque los diccionarios tienen un límite de 256 elementos."],correct:1,exp:"Una tabla hash convierte la clave en un número (su hash) y lo usa para calcular directamente la posición en memoria donde está el valor. No hay que comparar elementos uno por uno; el acceso es directo."},
    {id:"e2",type:"tf",q:"Un Dictionary<K,V> puede tener dos entradas con la misma clave.",correct:false,exp:"Falso. Las claves en un Dictionary deben ser únicas. Si intentás agregar una clave que ya existe con itemDB[key] = value, reemplaza el valor anterior. Si usás Add(), lanza una ArgumentException."},
    {id:"e3",type:"mc",q:"¿Qué estructura conviene para saber si el jugador ya visitó una sala específica, verificando en O(1)?",opts:["List<string> de salas visitadas","Dictionary<string, bool>","HashSet<string>","Un array de bool"],correct:2,exp:"HashSet<string> es ideal: Contains() es O(1), no permite duplicados, y no necesitás un valor asociado, solo saber si la sala está o no en el conjunto. Dictionary<string, bool> también funciona pero es redundante (el valor bool no agrega información)."},
    {id:"e4",type:"self",q:"Describí un caso de uso concreto para un Dictionary en un juego de tu elección.",model:"En un RPG: Dictionary<string, ItemData> como base de datos de ítems. Cuando el jugador recoge un ítem con ID 'iron_sword', hacés itemDB.TryGetValue('iron_sword', out var item) en O(1) para obtener sus stats. Sin diccionario, tendrías que recorrer una lista con Find o Where, que es O(n). En un juego con miles de items, esa diferencia es enorme."}
   ]},
  {id:"ds-03",title:"Stack y Queue",sub:"El orden de procesamiento importa",min:11,
   sections:[
    {t:"text",v:"No siempre querés acceder a tus datos por índice o por clave. A veces el orden de procesamiento importa: el último que entró sale primero (undo de acciones), o el primero que entró sale primero (turno de personajes). Para eso existen Stack y Queue."},
    {t:"h2",v:"Stack — El último en entrar, primero en salir (LIFO)"},
    {t:"text",v:"Stack funciona como una pila de platos: siempre agregás y sacás del tope. No podés acceder al medio sin pasar por encima. Las operaciones son Push (agregar al tope), Pop (sacar del tope) y Peek (ver el tope sin sacarlo). Todas son O(1)."},
    {t:"code",v:"// Sistema de undo en un level editor\nStack<GameAction> undoStack = new Stack<GameAction>();\n\n// El jugador coloca un bloque\nundoStack.Push(new PlaceBlockAction(position, blockType));\n\n// El jugador presiona Ctrl+Z\nif (undoStack.Count > 0)\n{\n    GameAction lastAction = undoStack.Pop(); // Saca la última acción\n    lastAction.Undo();                        // La revierte\n}\n\n// Ver qué acción se va a deshacer sin ejecutar\nif (undoStack.Count > 0)\n    Debug.Log(\"Próximo undo: \" + undoStack.Peek().description);"},
    {t:"call",label:"Analogía Stack",v:"Imaginá una pila de cartas. Solo podés poner una carta encima (Push) y solo podés sacar la del tope (Pop). No podés sacar la carta del fondo sin pasar por todas las de arriba."},
    {t:"h2",v:"Queue — El primero en entrar, primero en salir (FIFO)"},
    {t:"text",v:"Queue funciona como una fila de personas: el primero en llegar es el primero en ser atendido. Las operaciones son Enqueue (agregar al final), Dequeue (sacar del frente) y Peek (ver el frente sin sacarlo). Todas son O(1)."},
    {t:"code",v:"// Cola de turnos en combate por turnos\nQueue<Character> turnOrder = new Queue<Character>();\nturnOrder.Enqueue(player);\nturnOrder.Enqueue(enemy1);\nturnOrder.Enqueue(enemy2);\n\n// Procesar el siguiente turno\nCharacter current = turnOrder.Dequeue();\ncurrent.TakeTurn();\nturnOrder.Enqueue(current); // Vuelve al final de la cola\n\n// Cola de daño diferido (procesado al final del frame)\nQueue<DamageEvent> damageQueue = new Queue<DamageEvent>();\nwhile (damageQueue.Count > 0)\n{\n    DamageEvent dmg = damageQueue.Dequeue();\n    dmg.target.TakeDamage(dmg.amount);\n}"},
    {t:"call",label:"Stack vs Queue",v:"Stack: el último que entra es el primero que sale (undo, historial, DFS en pathfinding). Queue: el primero que entra es el primero que sale (turnos de personajes, mensajes de red, BFS). Si necesitás revertir cosas, Stack. Si necesitás procesarlas en orden de llegada, Queue."},
    {t:"call",label:"En una entrevista",v:"\"Stack implementa LIFO (Last In First Out) con Push, Pop y Peek en O(1). Queue implementa FIFO (First In First Out) con Enqueue, Dequeue y Peek en O(1). Stack se usa para historial de acciones (undo), DFS y gestión de estados. Queue se usa para procesamiento en orden de llegada, sistemas de mensajes y BFS.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Qué estructura de datos usarías para implementar un sistema de undo/redo?",opts:["Queue<GameAction>","List<GameAction>","Stack<GameAction>","Dictionary<int, GameAction>"],correct:2,exp:"Stack<GameAction>: cuando el jugador presiona Ctrl+Z, querés deshacer la última acción realizada. Stack (LIFO) permite Push de acciones y Pop de la más reciente en O(1), que es exactamente ese comportamiento."},
    {id:"e2",type:"tf",q:"En un Stack, Pop() saca el elemento del fondo de la pila.",correct:false,exp:"Falso. Pop() saca el elemento del TOPE de la pila, es decir, el que se agregó más recientemente. Eso es exactamente el comportamiento LIFO (Last In, First Out)."},
    {id:"e3",type:"mc",q:"¿Qué principio sigue una Queue?",opts:["LIFO — el último en entrar es el primero en salir","FIFO — el primero en entrar es el primero en salir","Orden aleatorio","Orden por prioridad"],correct:1,exp:"FIFO (First In, First Out): el primer elemento en ser encolado con Enqueue() es el primero en salir con Dequeue(). Como una fila de personas: quien llegó primero es atendido primero."},
    {id:"e4",type:"self",q:"Describí un caso de uso para Stack y uno para Queue en un juego, que sean distintos a los ejemplos de la lección.",model:"Stack: historial de diálogos en un RPG. Cada vez que avanzás en la conversación, la línea actual se hace Push. Si el jugador retrocede, Pop muestra la línea anterior. Queue: sistema de notificaciones de items recogidos. Cada ítem recogido se Enqueue, y se procesa un mensaje por vez en pantalla. El primero en recogerse es el primero en mostrarse."}
   ]},
  {id:"ds-04",title:"Complejidad Big O",sub:"El costo real del código",min:12,
   sections:[
    {t:"text",v:"Big O es la notación que describe cómo escala el tiempo de ejecución de un algoritmo a medida que crece la cantidad de datos. No mide segundos: mide la relación entre el tamaño de entrada y el número de operaciones. Es el lenguaje universal para comparar algoritmos."},
    {t:"h2",v:"Las complejidades más comunes"},
    {t:"code",v:"O(1)       Constante:        no importa el tamaño, siempre lo mismo\nO(log n)   Logarítmica:      crece muy lento (binary search)\nO(n)       Lineal:           una operación por elemento\nO(n log n) Lineal-log:       sort eficiente (List.Sort)\nO(n^2)     Cuadrática:       dos loops anidados — peligroso a escala\nO(2^n)     Exponencial:      evitar siempre que sea posible"},
    {t:"h2",v:"En código C# real"},
    {t:"code",v:"// O(1) — tiempo constante (no importa el tamaño)\nint first = myArray[0];               // acceso por índice\nitemDB[\"iron_sword\"];                  // Dictionary lookup\nstack.Push(action);                    // Stack/Queue push\n\n// O(n) — lineal (crece con la cantidad de elementos)\nforeach (Enemy e in enemies) { }      // iterar lista\nlist.Contains(enemy);                  // buscar en lista\nlist.Remove(enemy);                    // eliminar por valor\n\n// O(n^2) — cuadrática (PELIGROSO a escala)\nfor (int i = 0; i < enemies.Count; i++)\n    for (int j = 0; j < enemies.Count; j++)\n        CheckCollision(enemies[i], enemies[j]);\n// n=100: 10.000 ops | n=1000: 1.000.000 ops | n=10000: 100.000.000 ops"},
    {t:"call",label:"Por qué importa en juegos",v:"Con 100 enemigos, O(n^2) son 10,000 operaciones por frame: manejable. Con 1,000 enemigos, son 1,000,000 operaciones: el juego cae a 1 fps. Unity internamente usa estructuras espaciales para que la detección de colisiones sea O(n log n) en lugar de O(n^2). Cada vez que usás Physics.OverlapSphere, Unity está haciendo ese trabajo por vos."},
    {t:"h2",v:"Optimización con la estructura correcta"},
    {t:"code",v:"// MAL: buscar un enemy por ID cada frame — O(n)\nvoid Update()\n{\n    foreach (Enemy e in allEnemies)     // O(n) cada frame\n        if (e.id == targetId) ...       // n comparaciones por frame\n}\n\n// BIEN: Dictionary para lookup O(1)\nDictionary<int, Enemy> enemyById = new Dictionary<int, Enemy>();\n\nvoid Update()\n{\n    if (enemyById.TryGetValue(targetId, out Enemy e)) // O(1)\n        ...;\n}"},
    {t:"call",label:"En una entrevista",v:"\"Big O describe cómo escala la complejidad de tiempo (u espacio) de un algoritmo con el tamaño de la entrada. O(1) es constante (ideal), O(log n) logarítmica, O(n) lineal, O(n^2) cuadrática (peligroso a escala). Se usa para comparar algoritmos y elegir la estructura de datos correcta según el problema.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Cuál es la complejidad de acceder a un elemento de un array por su índice?",opts:["O(n) — depende del tamaño","O(log n) — búsqueda binaria","O(1) — acceso directo","O(n^2) — compara todos"],correct:2,exp:"O(1): la dirección de memoria de cualquier elemento se calcula directamente con base + índice * tamaño. No hay que recorrer nada; el acceso es instantáneo sin importar el tamaño del array."},
    {id:"e2",type:"mc",q:"¿Cuál es la complejidad de List<T>.Contains()?",opts:["O(1) — usa hashing","O(log n) — búsqueda binaria","O(n) — recorre todos los elementos","O(n^2) — compara todos con todos"],correct:2,exp:"O(n): Contains() compara el valor buscado con cada elemento de la lista uno por uno hasta encontrarlo o llegar al final. Para búsqueda O(1) necesitás un Dictionary o HashSet."},
    {id:"e3",type:"tf",q:"O(n^2) es una complejidad aceptable para sistemas que manejan miles de entidades en tiempo real.",correct:false,exp:"Falso. Con 1,000 entidades, O(n^2) genera 1,000,000 operaciones por frame. A 60fps eso es 60 millones de operaciones por segundo, lo que haría el juego inmanejable. Para sistemas con muchas entidades hay que apuntar a O(n) o mejor."},
    {id:"e4",type:"self",q:"Explicá con tus propias palabras por qué elegir la estructura de datos correcta puede ser más importante que optimizar el código.",model:"Porque la complejidad algorítmica es un multiplicador. Podés optimizar cuánto tarda una operación O(n^2) y reducirla a la mitad, pero con 10,000 elementos seguís teniendo 50,000,000 operaciones. En cambio, cambiar de List.Contains (O(n)) a Dictionary TryGetValue (O(1)) hace que con 10,000 elementos la misma búsqueda pase de 10,000 comparaciones a 1. Ninguna optimización de bajo nivel supera eso."}
   ]},
  {id:"ds-05",title:"Búsqueda y Ordenamiento",sub:"Encontrar y clasificar datos",min:12,
   sections:[
    {t:"text",v:"Dos operaciones que aparecen en casi cualquier sistema de juego: buscar algo dentro de una colección, y ordenar una colección según algún criterio. Entender cómo funcionan y cuánto cuestan te ayuda a elegir el enfoque correcto."},
    {t:"h2",v:"Búsqueda lineal — O(n)"},
    {t:"text",v:"La búsqueda más simple: recorrer todos los elementos uno por uno hasta encontrar lo que buscás. Funciona en cualquier colección, ordenada o no. En juegos, es la búsqueda más común por su simplicidad."},
    {t:"code",v:"// Buscar el enemigo más cercano al jugador\nEnemy FindClosest(Vector3 playerPos, List<Enemy> enemies)\n{\n    Enemy closest = null;\n    float minDist = float.MaxValue;\n\n    foreach (Enemy e in enemies)         // O(n)\n    {\n        float dist = Vector3.Distance(playerPos, e.transform.position);\n        if (dist < minDist)\n        {\n            minDist = dist;\n            closest = e;\n        }\n    }\n    return closest;\n}\n// Con 500 enemies: 500 comparaciones por llamada. Aceptable."},
    {t:"h2",v:"Búsqueda binaria — O(log n)"},
    {t:"text",v:"Si la colección está ordenada, podés hacer búsqueda binaria: en cada paso compará el elemento del medio y descartás la mitad de los elementos restantes. Con 1,000 elementos, necesitás máximo 10 comparaciones. Con 1,000,000: máximo 20."},
    {t:"code",v:"// Lista de highscores ordenada (mayor a menor)\nList<int> scores = new List<int> { 9500, 8200, 7100, 5400, 3200 };\n\n// BinarySearch requiere lista ordenada\n// Devuelve el índice si lo encuentra (negativo si no)\nint idx = scores.BinarySearch(7100);  // O(log n) -> devuelve 2\n\n// Para buscar objetos propios con criterio customizado,\n// usás un IComparer<T> o LINQ (ver abajo)"},
    {t:"h2",v:"Ordenamiento con List.Sort"},
    {t:"code",v:"// Ordenar items del inventario por valor, mayor primero\ninventory.Sort((a, b) => b.value.CompareTo(a.value)); // O(n log n)\n\n// Ordenar enemies por distancia al jugador\nenemies.Sort((a, b) =>\n{\n    float da = Vector3.Distance(player.position, a.transform.position);\n    float db = Vector3.Distance(player.position, b.transform.position);\n    return da.CompareTo(db);\n}); // O(n log n)"},
    {t:"h2",v:"LINQ: consultas expresivas"},
    {t:"text",v:"LINQ (Language Integrated Query) permite consultar colecciones de forma declarativa. Internamente usa los mismos algoritmos, pero el código es mucho más legible. Para usarlo necesitás using System.Linq al inicio del archivo."},
    {t:"code",v:"using System.Linq;\n\n// Filtrar enemies vivos con mas de 50 hp\nvar strong = enemies.Where(e => e.health > 50).ToList();   // O(n)\n\n// El primero que cumpla la condición (null si ninguno)\nEnemy boss = enemies.FirstOrDefault(e => e.isBoss);        // O(n)\n\n// Contar cuántos tienen veneno activo\nint poisoned = enemies.Count(e => e.hasPoisonDebuff);      // O(n)\n\n// Verificar si todos tienen vida completa\nbool allHealthy = enemies.All(e => e.health == e.maxHealth); // O(n)\n\n// Obtener el de mayor vida\nEnemy strongest = enemies.MaxBy(e => e.health);            // O(n)"},
    {t:"call",label:"En una entrevista",v:"\"Búsqueda lineal es O(n) y funciona en cualquier colección. Búsqueda binaria es O(log n) pero requiere datos ordenados. Ordenar con un algoritmo eficiente (como Timsort que usa C#) es O(n log n). LINQ en C# permite expresar estas operaciones de forma declarativa manteniendo las mismas complejidades subyacentes.\""}
   ],
   exercises:[
    {id:"e1",type:"mc",q:"¿Cuál es la complejidad de la búsqueda binaria?",opts:["O(n^2) — compara todos los pares","O(n) — recorre todos los elementos","O(log n) — descarta la mitad en cada paso","O(1) — acceso directo"],correct:2,exp:"O(log n): en cada comparación, la búsqueda binaria descarta la mitad de los elementos restantes. Con 1,024 elementos necesitás máximo 10 pasos (log2(1024) = 10). Es extremadamente eficiente para colecciones grandes."},
    {id:"e2",type:"tf",q:"La búsqueda binaria funciona correctamente en cualquier colección, ordenada o no.",correct:false,exp:"Falso. La búsqueda binaria REQUIERE que la colección esté ordenada. Si no lo está, el algoritmo descartaría la mitad equivocada y daría resultados incorrectos. Para colecciones no ordenadas, la única opción es búsqueda lineal O(n)."},
    {id:"e3",type:"mc",q:"¿Cuál es la complejidad de List.Sort() en C#?",opts:["O(n) — lineal","O(n log n) — lineal-logarítmica","O(n^2) — cuadrática","O(1) — constante"],correct:1,exp:"O(n log n): C# usa Timsort internamente, una variante de merge sort. Es el mejor caso posible para un algoritmo de ordenamiento de propósito general. Es significativamente mejor que O(n^2) a escala."},
    {id:"e4",type:"self",q:"¿Cuándo usarías búsqueda lineal vs binaria en un juego? Pensá un caso concreto para cada una.",model:"Búsqueda lineal cuando la colección no está ordenada o es pequeña: buscar el enemigo más cercano en una lista de 50 enemies activos. El costo O(n) es aceptable y no vale la pena mantener la lista ordenada por distancia (que cambia cada frame). Búsqueda binaria cuando la colección está ordenada y es estable: buscar el récord de un jugador en una tabla de highscores ordenada por puntaje. La tabla no cambia frecuentemente, pero las búsquedas son frecuentes, entonces O(log n) vale la pena."}
   ]}
  ]
}
